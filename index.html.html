<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline de Retenção</title>
<style>
  :root{
    --bg:#f2f4fa;
    --surface:#ffffff;
    --surface-2:#eaeef8;
    --surface-3:#dde3f2;
    --ink:#101a33;
    --ink-dim:#57628a;
    --ink-faint:#8792b3;
    --border:#dbe1f0;
    --border-soft:#e8ecf7;
    --navy:#0b2f6b;
    --navy-2:#123a86;
    --navy-3:#0e2a5c;
    --accent:#2e5bff;
    --accent-soft:#e7ecff;
    --good:#137a4e;
    --good-soft:#e2f5ec;
    --warn:#b5730a;
    --warn-soft:#fdf0dc;
    --bad:#c02e3a;
    --bad-soft:#fbe6e8;
    --cold:#5c6a8f;
    --cold-soft:#eaedf6;
    --shadow:0 1px 2px rgba(16,26,51,.06), 0 8px 24px -12px rgba(16,26,51,.18);
    --shadow-lg:0 4px 10px rgba(16,26,51,.08), 0 24px 48px -20px rgba(16,26,51,.3);
    --radius:14px;
    --radius-sm:9px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1120;
      --surface:#131c30;
      --surface-2:#182338;
      --surface-3:#1f2c47;
      --ink:#eef1fb;
      --ink-dim:#a3adcc;
      --ink-faint:#6d7797;
      --border:#2a3554;
      --border-soft:#212c47;
      --navy:#16336f;
      --navy-2:#1c4291;
      --navy-3:#122a5c;
      --accent:#6d8cff;
      --accent-soft:#1c2b57;
      --good:#3fcf94;
      --good-soft:#123528;
      --warn:#f2ab3f;
      --warn-soft:#3a2c11;
      --bad:#ff6b76;
      --bad-soft:#3c1b21;
      --cold:#93a0c7;
      --cold-soft:#1c2440;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1120;
    --surface:#131c30;
    --surface-2:#182338;
    --surface-3:#1f2c47;
    --ink:#eef1fb;
    --ink-dim:#a3adcc;
    --ink-faint:#6d7797;
    --border:#2a3554;
    --border-soft:#212c47;
    --navy:#16336f;
    --navy-2:#1c4291;
    --navy-3:#122a5c;
    --accent:#6d8cff;
    --accent-soft:#1c2b57;
    --good:#3fcf94;
    --good-soft:#123528;
    --warn:#f2ab3f;
    --warn-soft:#3a2c11;
    --bad:#ff6b76;
    --bad-soft:#3c1b21;
    --cold:#93a0c7;
    --cold-soft:#1c2440;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:13.5px;
    line-height:1.45;
  }
  h1,h2,h3,h4{font-family:'Sora','Inter',system-ui,sans-serif; margin:0; text-wrap:balance;}
  ::selection{background:var(--accent-soft);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit; color:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  a{color:inherit;}

  /* ---------- App shell ---------- */
  #app{display:flex; flex-direction:column; min-height:100vh;}

  .topbar{
    background:linear-gradient(155deg,var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    color:#fff;
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:6px;}
  .brand-mark{
    width:32px;height:32px;border-radius:9px;
    background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif; font-weight:700; font-size:15px;
    border:1px solid rgba(255,255,255,.22);
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text b{font-family:'Sora',sans-serif; font-size:14.5px; font-weight:700; letter-spacing:.2px;}
  .brand-text span{font-size:10.5px; color:rgba(255,255,255,.62); letter-spacing:.4px; text-transform:uppercase;}

  .searchwrap{
    flex:1 1 320px; min-width:220px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16);
    border-radius:999px;
    display:flex; align-items:center; gap:8px;
    padding:9px 14px;
  }
  .searchwrap:focus-within{background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.35);}
  .searchwrap svg{flex:none; opacity:.7;}
  .searchwrap input{
    background:none;border:none;outline:none;color:#fff;
    width:100%; font-size:13px;
  }
  .searchwrap input::placeholder{color:rgba(255,255,255,.55);}

  .topbar-actions{display:flex; align-items:center; gap:8px; margin-left:auto;}
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); border-radius:10px; padding:8px 13px; font-size:12.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap;
    transition:filter .12s, transform .05s;
  }
  .btn:hover{filter:brightness(0.97);}
  .btn:active{transform:translateY(1px);}
  .btn-ghost-inverse{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.22); color:#fff;}
  .btn-ghost-inverse:hover{background:rgba(255,255,255,.18);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-subtle{background:var(--surface-2); border-color:transparent;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .user-chip{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    border-radius:999px; padding:5px 12px 5px 5px; font-size:12px; font-weight:600;
  }
  .user-avatar{
    width:24px;height:24px;border-radius:999px; background:var(--accent);
    display:flex;align-items:center;justify-content:center; font-size:10.5px; font-weight:700;
  }

  .btn-nav{background:transparent; border-color:rgba(255,255,255,.22); color:rgba(255,255,255,.82);}
  .btn-nav:hover{background:rgba(255,255,255,.1); color:#fff;}
  .btn-nav.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .header-ticker{
    background:var(--navy-2); border-top:1px solid rgba(255,255,255,.08);
    padding:8px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    font-size:12px; color:rgba(255,255,255,.92);
  }
  .ht-day-chip{
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:5px 12px; font-weight:700;
    white-space:nowrap;
  }
  .ht-items{display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:rgba(255,255,255,.85);}
  .ht-item{background:rgba(255,255,255,.06); border-radius:999px; padding:4px 10px; white-space:nowrap;}
  .ht-sep{width:1px; align-self:stretch; background:rgba(255,255,255,.15); margin:0 2px;}
  .ht-quote-wrap{flex:1 1 auto; display:flex; align-items:center; justify-content:center; gap:10px; min-width:0;}
  .header-ticker{padding-top:12px; padding-bottom:12px;}
  .ht-quote{
    font-style:italic; color:var(--accent-2, #ffd479); font-weight:800;
    font-size:20px; line-height:1.3; text-align:center; letter-spacing:.1px;
  }
  @media (max-width: 980px){ .ht-quote-wrap{flex-basis:100%; justify-content:flex-start;} .ht-quote{text-align:left; font-size:17px;} }

  .subbar{
    background:var(--navy-3);
    padding:0 22px;
    display:flex; gap:4px; flex-wrap:wrap;
  }
  .tab{
    padding:10px 16px; font-size:12.5px; font-weight:600; color:rgba(255,255,255,.6);
    border-bottom:2px solid transparent; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .tab.active{color:#fff; border-color:var(--accent);}
  .tab:hover:not(.active){color:rgba(255,255,255,.85);}

  /* Cabeçalho (topo + ticker + abas + filtros) "congelado" no Dashboard e
     Comparativo: some position:sticky no bloco inteiro (não em cada peça
     separada) para não precisar calcular offsets individuais — o bloco
     inteiro gruda no topo como uma unidade só ao rolar a página. Em
     Pipeline/Gestão de Contatos ele continua no fluxo normal, já que essas
     telas raramente precisam rolar a página inteira. */
  .app-header-sticky.is-sticky{ position:sticky; top:0; z-index:60; }
  .filterbar-sticky-wrap{ padding:14px 22px 14px; background:var(--bg); }
  .app-header-sticky.is-sticky .filterbar-sticky-wrap{
    box-shadow:0 8px 14px -10px rgba(9,14,28,.35);
  }

  main{padding:18px 22px 44px; display:flex; flex-direction:column; gap:16px;}

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---------- filter row ---------- */
  .filterbar{padding:14px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px; min-width:150px;}
  .field label{font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-faint); display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .field-clear{font-size:11px; font-weight:800; color:var(--accent); background:none; border:none; cursor:pointer; padding:0 0 0 4px; text-transform:none; letter-spacing:0;}
  .field-clear:hover{color:var(--bad);}
  .select-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    border:1px solid var(--border); background:var(--surface); border-radius:10px;
    padding:8px 10px; font-size:12.5px; font-weight:600; cursor:pointer; min-width:150px;
    color:var(--ink);
  }
  .select-btn:hover{border-color:var(--ink-faint);}
  .select-btn.has-value{border-color:var(--accent); background:var(--accent-soft); color:var(--navy-3);}
  .select-btn .chev{opacity:.55; flex:none;}
  .select-btn .count-badge{
    background:var(--accent); color:#fff; border-radius:999px; font-size:10px; font-weight:700;
    padding:1px 6px; margin-left:4px;
  }
  .month-select{min-width:170px; font-weight:700;}
  .filter-clear{font-size:11.5px; color:var(--accent); font-weight:700; cursor:pointer; background:none; border:none; padding:8px 4px;}

  .popover{
    position:fixed; z-index:200; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow-lg); padding:8px; min-width:220px; max-height:320px;
    overflow-y:auto;
  }
  .popover-item{
    display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:7px; cursor:pointer; font-size:12.5px;
  }
  .popover-item:hover{background:var(--surface-2);}
  .popover-item input{margin:0;}
  .popover-item .tag-dot{width:8px;height:8px;border-radius:999px; flex:none;}
  .popover-item .n{margin-left:auto; color:var(--ink-faint); font-size:11px;}

  /* ---------- shortcuts ---------- */
  .shortcuts{padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .shortcut{
    display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface-2);
    border-radius:999px; padding:7px 13px; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-dim);
  }
  .shortcut .dot{width:7px;height:7px;border-radius:999px;}
  .shortcut:hover{border-color:var(--ink-faint);}
  .shortcut.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  .shortcut .n{font-weight:800;}
  .shortcuts-meta{margin-left:auto; font-size:11px; color:var(--ink-faint);}

  /* ---------- KPI row ---------- */
  .kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--border-soft); border-radius:var(--radius); overflow:hidden; border:1px solid var(--border);}
  .kpi{background:var(--surface); padding:14px 16px; display:flex; flex-direction:column; gap:6px; min-width:0;}
  .kpi .k-label{display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint);}
  .kpi .k-value{font-family:'Sora',sans-serif; font-size:23px; font-weight:700; line-height:1;}
  .kpi .k-sub{font-size:11px; color:var(--ink-faint);}
  .kpi.ganho .k-value{color:var(--good);}
  .kpi.perdido .k-value{color:var(--bad);}
  .kpi-bars{display:flex; flex-direction:column; gap:4px; margin-top:2px;}
  .kpi-bar-row{display:flex; align-items:center; gap:6px; font-size:10.5px;}
  .kpi-bar-row .lbl{width:66px; flex:none; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .kpi-bar-track{display:block; flex:1; height:5px; background:var(--surface-3); border-radius:4px; overflow:hidden;}
  .kpi-bar-fill{display:block; height:100%; border-radius:4px; background:var(--accent);}
  .kpi-bar-row .pct{width:32px; flex:none; text-align:right; font-weight:700; color:var(--ink);}
  .kpis{grid-template-columns:repeat(6,1fr);}
  @media (max-width:1180px){ .kpis{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:680px){ .kpis{grid-template-columns:repeat(2,1fr);} }

  /* ---- Dashboard v2 ---- */
  .dash-wrap{display:flex; flex-direction:column; gap:14px;}
  .dash-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  .dash-grid.cols-2{grid-template-columns:1.3fr 1fr;}
  @media (max-width:1180px){ .dash-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:760px){ .dash-grid, .dash-grid.cols-2{grid-template-columns:1fr;} }
  .dash-card{padding:16px;}
  .dash-card h3{font-size:11.5px; margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid var(--border-soft); text-transform:uppercase; letter-spacing:.5px; font-weight:800; color:var(--ink);}
  .dash-h3-export{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; border-radius:6px 6px 0 0; transition:background .12s;}
  .dash-h3-export:hover{background:var(--surface-2);}
  .dash-h3-export:hover .dash-export-btn{opacity:1;}
  .dash-export-btn{flex:none; font-size:10px; font-weight:700; text-transform:none; letter-spacing:0; color:var(--accent); background:var(--surface-2); border:1px solid var(--border-soft); border-radius:6px; padding:3px 7px; cursor:pointer; opacity:.75; pointer-events:none;}
  .dash-card .sub-note{font-size:11px; color:var(--ink-faint); margin-bottom:10px;}
  .donut-row{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .donut{width:118px; height:118px; border-radius:50%; flex:none; position:relative;}
  .donut::after{content:""; position:absolute; inset:16px; border-radius:50%; background:var(--surface);}
  .donut-legend{flex:1; min-width:180px; display:flex; flex-direction:column; gap:6px;}
  .donut-legend-row{display:flex; align-items:center; gap:7px; font-size:12px;}
  .donut-legend-row i{width:9px; height:9px; border-radius:2px; flex:none;}
  .donut-legend-row .dl-label{flex:1; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .donut-legend-row .dl-val{font-weight:700; color:var(--ink);}
  .donut-legend-row .dl-pct{width:38px; text-align:right; color:var(--ink-faint); font-size:11px;}
  .hbar-list{display:flex; flex-direction:column; gap:7px; max-height:260px; overflow-y:auto; padding-right:2px;}
  .hbar-row{display:grid; grid-template-columns:1fr 2fr auto; align-items:center; gap:8px; font-size:11.5px;}
  .hbar-row .hb-label{color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hbar-track{display:block; height:8px; background:var(--surface-3); border-radius:4px; overflow:hidden;}
  .hbar-fill{display:block; height:100%; border-radius:4px; background:var(--accent);}
  .hbar-row .hb-val{font-weight:700; color:var(--ink); text-align:right; white-space:nowrap;}
  .dash-callout{margin-top:10px; padding:9px 11px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-soft); font-size:12px; color:var(--ink-dim);}
  .dash-callout b{color:var(--ink);}
  .uf-map-wrap{display:grid; grid-template-columns:1.8fr 1fr; gap:24px; align-items:start;}
  @media (max-width:760px){ .uf-map-wrap{grid-template-columns:1fr;} }
  .uf-map-wrap svg path{stroke:var(--surface); stroke-width:1.2; cursor:default; transition:opacity .15s;}
  .uf-map-wrap svg path:hover{opacity:.75;}
  .uf-map-wrap svg text{font-size:9px; fill:var(--ink); pointer-events:none; font-weight:700;}
  .heat-legend{display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--ink-faint); margin-top:8px;}
  .heat-legend .bar{flex:1; height:8px; border-radius:4px; background:linear-gradient(90deg,#3b7fd9,#e08a1f,#c0392b);}
  .top-uf-list{display:flex; flex-direction:column; gap:6px;}
  .top-uf-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .top-uf-row .rank{width:18px; flex:none; color:var(--ink-faint); font-weight:700; font-size:11px;}
  .top-uf-row .uf-swatch{width:10px; height:10px; border-radius:2px; flex:none;}
  .top-uf-row .uf-name{flex:1; color:var(--ink-dim);}
  .top-uf-row .uf-count{font-weight:700; color:var(--ink);}
  .top-uf-row .uf-count-pair{display:flex; gap:10px; flex:none;}
  .top-uf-row .uf-count-pair span{width:38px; text-align:right; font-weight:700; color:var(--ink);}
  .top-uf-header{margin-bottom:2px;}
  .top-uf-header .uf-name{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint);}
  .top-uf-header .uf-count-pair span{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; color:var(--ink-faint);}
  .trend-up{color:var(--good); font-weight:700;}
  .trend-down{color:var(--bad); font-weight:700;}
  .trend-flat{color:var(--ink-faint); font-weight:700;}
  .stat-mini-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:4px;}
  .stat-mini{padding:10px 14px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-soft); min-width:150px;}
  .stat-mini .sm-label{font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint); font-weight:700;}
  .stat-mini .sm-value{font-family:'Sora',sans-serif; font-size:19px; font-weight:700; margin-top:2px;}
  .donut.pie::after{content:none;}
  .therm-row{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
  .therm-info{flex:1; min-width:190px;}
  .therm-dominant b{font-family:'Sora',sans-serif; font-size:19px; letter-spacing:.3px;}
  .therm-desc{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
  .therm-total{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .uf-panel .uf-map-svg-col{width:100%; max-width:520px; margin:0 auto;}

  /* ---- Agenda de Ligações ---- */
  .agd-layout{display:grid; grid-template-columns:290px 1fr; gap:16px; align-items:start;}
  @media (max-width:920px){ .agd-layout{grid-template-columns:1fr;} }
  .agd-panel{padding:16px;}
  .agd-panel + .agd-panel{margin-top:14px;}
  .agd-h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:800; color:var(--ink-faint); margin:0 0 10px;}
  .agd-today-count{font-family:'Sora',sans-serif; font-size:32px; font-weight:700; line-height:1;}
  .agd-today-cap{color:var(--ink-dim); font-size:12.5px; margin-top:4px;}
  .agd-overdue-flag{margin-top:8px; font-size:12px; font-weight:700; color:var(--bad); background:var(--bad-soft); border-radius:8px; padding:6px 9px; cursor:pointer;}
  .agd-next-call{margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--accent-soft); display:flex; flex-direction:column; gap:2px; cursor:pointer;}
  .agd-next-call .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); font-weight:700;}
  .agd-next-call .nm{font-weight:700; font-size:13.5px; margin-top:2px; color:var(--ink);}
  .agd-next-call .wh{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim);}
  .agd-empty{color:var(--ink-faint); font-size:12.5px; padding:4px 2px;}
  .agd-upcoming-list{display:flex; flex-direction:column; gap:7px; max-height:320px; overflow-y:auto; padding-right:2px;}
  .agd-upcoming-item{display:flex; gap:9px; align-items:flex-start; padding:8px 9px; border-radius:9px; border:1px solid var(--border); cursor:pointer; transition:background .12s;}
  .agd-upcoming-item:hover{background:var(--surface-2);}
  .agd-upcoming-item.overdue{border-color:var(--bad); background:var(--bad-soft);}
  .agd-upcoming-item .dchip{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; background:var(--surface-3); border-radius:6px; padding:3px 6px; white-space:nowrap; flex:none; text-align:center; min-width:42px;}
  .agd-upcoming-item.overdue .dchip{background:var(--bad); color:#fff;}
  .agd-upcoming-item .info{min-width:0;}
  .agd-upcoming-item .nm{font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .agd-upcoming-item .mt{font-size:11px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .agd-cal-card{padding:0; overflow:hidden;}
  .agd-cal-head{display:flex; align-items:center; gap:10px; padding:14px 16px 0; flex-wrap:wrap;}
  .agd-cal-head .agd-month-label{font-size:16px; font-weight:700; font-family:'Sora',sans-serif;}
  .agd-nav-btns{display:flex; gap:4px;}
  .agd-nav-btns button{width:30px; height:30px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer;}
  .agd-nav-btns button:hover{background:var(--surface-2);}
  .agd-nav-btns button.agd-today-btn{width:auto; padding:0 10px; font-size:11.5px; font-weight:700;}
  .agd-cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--border); margin-top:12px;}
  .agd-cal-weekdays div{padding:8px 4px; text-align:center; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint);}
  .agd-cal-grid{display:grid; grid-template-columns:repeat(7,1fr);}
  .agd-cal-cell{min-height:78px; border-right:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); padding:5px 5px 6px; cursor:pointer; transition:background .12s;}
  .agd-cal-cell:nth-child(7n){border-right:none;}
  .agd-cal-cell:hover{background:var(--surface-2);}
  .agd-cal-cell.other-month{background:var(--surface-2);}
  .agd-cal-cell.other-month .agd-daynum{color:var(--ink-faint);}
  .agd-cal-cell.selected{box-shadow:inset 0 0 0 2px var(--accent);}
  .agd-cal-cell.today .agd-daynum{background:var(--accent); color:#fff; border-radius:6px; padding:0 5px;}
  .agd-daynum{font-family:'Sora',sans-serif; font-weight:600; font-size:12px; color:var(--ink);}
  .agd-cal-chips{margin-top:4px; display:flex; flex-direction:column; gap:2px;}
  .agd-cal-chip{font-size:10px; padding:1px 4px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;}
  .agd-cal-chip.atrasada{background:var(--bad-soft); color:var(--bad);}
  .agd-cal-chip.hoje{background:var(--warn-soft); color:var(--warn);}
  .agd-cal-chip.futuro{background:var(--accent-soft); color:var(--accent);}
  .agd-cal-more{font-size:9.5px; color:var(--ink-faint); margin-top:1px;}
  .agd-day-card{margin-top:14px; padding:16px;}
  .agd-day-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .agd-day-head h3{font-size:14.5px; font-weight:700;}
  .agd-day-list{display:flex; flex-direction:column; gap:8px;}
  .agd-call-row{display:flex; align-items:flex-start; gap:12px; padding:11px 12px; border:1px solid var(--border); border-radius:11px; background:var(--surface);}
  .agd-call-row.overdue{border-color:var(--bad);}
  .agd-call-tcol{width:52px; flex:none; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; color:var(--ink); padding-top:1px;}
  .agd-call-body{flex:1; min-width:0;}
  .agd-call-top{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .agd-call-name{font-weight:700; font-size:13.5px;}
  .agd-call-meta{font-size:11.5px; color:var(--ink-dim); margin-top:3px;}
  .agd-call-notes{font-size:12px; color:var(--ink-dim); margin-top:4px; background:var(--surface-2); border-radius:8px; padding:6px 8px;}
  .agd-call-phone{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--accent); margin-top:4px; display:inline-block;}
  .agd-call-actions{flex:none; display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end;}
  .agd-empty-day{padding:22px 10px; text-align:center; color:var(--ink-faint); font-size:12.5px;}

  /* ---------- Identificação da Agenda (Gestão de Contatos) ----------
     Não é autenticação de verdade (sem servidor/senha) — é uma identificação
     por e-mail, guardada no navegador de quem acessa, usada só para filtrar
     a agenda para os leads do próprio vendedor. */
  .agd-gate-wrap{display:flex; align-items:center; justify-content:center; padding:40px 16px;}
  .agd-gate-wrap.app-gate-fullpage{min-height:100vh; background:var(--bg);}
  .agd-gate-card{
    width:100%; max-width:380px; background:linear-gradient(155deg,var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    border-radius:16px; box-shadow:var(--shadow-lg); overflow:hidden; color:#fff;
  }
  .agd-gate-brand{display:flex; align-items:center; gap:10px; padding:20px 22px; border-bottom:1px solid rgba(255,255,255,.14);}
  .agd-gate-brand .brand-mark{width:34px;height:34px;border-radius:9px; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:700; font-size:16px; border:1px solid rgba(255,255,255,.22); flex:none;}
  .agd-gate-brand .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .agd-gate-brand .brand-text b{font-family:'Sora',sans-serif; font-size:15px; font-weight:700; letter-spacing:.2px;}
  .agd-gate-brand .brand-text span{font-size:10.5px; color:rgba(255,255,255,.62); letter-spacing:.4px; text-transform:uppercase;}
  .agd-gate-body{padding:20px 22px 22px;}
  .agd-gate-sub{font-size:12.5px; color:rgba(255,255,255,.75); text-align:center; margin-bottom:16px;}
  .agd-gate-body .field{margin-bottom:12px;}
  .agd-gate-body .field label{font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:rgba(255,255,255,.6); margin-bottom:5px; display:block;}
  .agd-gate-body input.form-input{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.2); color:#fff;}
  .agd-gate-body input.form-input::placeholder{color:rgba(255,255,255,.4);}
  .agd-gate-error{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); border-radius:9px; padding:8px 10px; font-size:12px; color:#ffd6d6; margin-bottom:12px;}
  .agd-gate-hint{font-size:10.5px; color:rgba(255,255,255,.55); margin-top:12px; line-height:1.5;}
  .agd-identity-bar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:9px 14px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:10px; margin-bottom:12px; font-size:12px; color:var(--ink-dim);}
  .agd-identity-bar b{color:var(--ink);}
  .agd-identity-bar button{background:none; border:none; color:var(--accent); font-weight:700; font-size:12px; cursor:pointer; padding:0;}

  /* ---------- Painel semanal (Gestão de Contatos) ---------- */
  .agd-week-pinned-row{display:flex; align-items:stretch; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
  .agd-week-day-pinned{flex:1 1 320px; margin:0;}
  .agd-week-pinned-tag{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; background:var(--accent); color:#fff; border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:middle;}
  .agd-week-toggle{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:8px; flex:0 0 auto;}
  .agd-week-panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:14px; display:grid; grid-template-columns:repeat(5,1fr); gap:10px;
  }
  @media (max-width:1100px){ .agd-week-panel{grid-template-columns:repeat(2,1fr);} }
  .agd-week-day{border:1px solid var(--border); border-radius:10px; padding:10px; background:var(--surface-2);}
  .agd-week-day.is-today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .agd-week-day-head{display:flex; align-items:center; gap:6px; font-weight:800; font-size:12.5px; color:var(--navy); margin-bottom:6px;}
  .agd-week-day ul{margin:0 0 8px; padding-left:16px; font-size:11.5px; color:var(--ink-dim);}
  .agd-week-day li{margin-bottom:3px;}
  .agd-week-obj{font-size:11px; color:var(--accent); font-weight:600; line-height:1.4;}
  .agd-week-routine{
    grid-column:1/-1; display:flex; gap:10px; flex-wrap:wrap; border-top:1px dashed var(--border); padding-top:10px; margin-top:2px;
  }
  .agd-week-routine .chip{background:var(--navy-2); color:#fff; border-radius:999px; padding:5px 12px; font-size:11px; font-weight:600;}

  /* ---------- Pop-up de contato (Gestão de Contatos) ---------- */
  .contact-popup .modal{max-width:560px;}
  .cp-field{margin-bottom:10px;}
  .cp-field label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); margin-bottom:4px;}
  .cp-hist-list{max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; border:1px solid var(--border); border-radius:8px; padding:8px; background:var(--surface-2);}
  .cp-hist-item{font-size:12px; color:var(--ink-dim); border-bottom:1px dashed var(--border); padding-bottom:5px;}
  .cp-hist-item:last-child{border-bottom:none; padding-bottom:0;}
  .cp-hist-d{font-weight:700; color:var(--ink); margin-right:6px;}

  /* ---------- Kanban ---------- */
  .board-wrap{overflow-x:auto; padding-bottom:6px;}
  .board{display:grid; grid-auto-flow:column; grid-auto-columns:250px; gap:10px; align-items:start;}
  .col{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); display:flex; flex-direction:column; max-height:calc(100vh - 300px); min-height:220px;}
  .col-head{
    padding:11px 12px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border-soft);
    position:sticky; top:0; background:var(--surface); border-radius:var(--radius) var(--radius) 0 0; z-index:2;
  }
  .col-head .dot{width:8px;height:8px;border-radius:999px; flex:none;}
  .col-head b{font-size:12px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .col-head .count{font-size:11px; font-weight:800; color:var(--ink-faint); background:var(--surface-2); border-radius:999px; padding:2px 8px;}
  .col-search-btn{background:none; border:none; cursor:pointer; font-size:13px; padding:2px; flex:none; opacity:.6; line-height:1;}
  .col-search-btn:hover{opacity:1;}
  .col-body{padding:8px; display:flex; flex-direction:column; gap:8px; overflow-y:auto;}
  .col.drop-hover{outline:2px dashed var(--accent); outline-offset:-4px;}
  .col-sum{padding:6px 12px 10px; font-size:10.5px; color:var(--ink-faint); border-top:1px dashed var(--border-soft);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 11px;
    cursor:grab; display:flex; flex-direction:column; gap:7px; box-shadow:0 1px 0 rgba(16,26,51,.03);
  }
  .card:hover{border-color:var(--ink-faint);}
  .card.dragging{opacity:.4;}
  .card.bulk-selected{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 2px var(--accent) inset;}
  .card-top{display:flex; align-items:flex-start; gap:6px;}
  .card-name{font-size:12.3px; font-weight:700; line-height:1.28; flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .temp-dot{width:8px;height:8px;border-radius:999px; margin-top:3px; flex:none;}
  .card-meta{display:flex; flex-wrap:wrap; gap:5px; font-size:10.3px; color:var(--ink-dim);}
  .chip{background:var(--surface-2); border-radius:6px; padding:2px 6px; font-weight:600;}
  .chip.status-ganho{background:var(--good-soft); color:var(--good);}
  .chip.status-perdido{background:var(--bad-soft); color:var(--bad);}
  .chip.status-inativam{background:var(--warn-soft); color:var(--warn);}
  .chip.status-inativo{background:var(--surface-3); color:var(--ink-faint);}
  .chip.status-proposta{background:#7a5cd622; color:#7a5cd6;}
  .chip.status-negociando{background:#c98a1f22; color:#c98a1f;}
  .card-days{font-size:10.5px; font-weight:700;}
  .card-days.overdue{color:var(--bad);}
  .card-foot{display:flex; align-items:center; justify-content:space-between; font-size:10.3px; color:var(--ink-faint); border-top:1px solid var(--border-soft); padding-top:6px;}
  .card-foot .stale{color:var(--warn); font-weight:700;}

  .empty-col{padding:22px 10px; text-align:center; color:var(--ink-faint); font-size:11.5px; border:1px dashed var(--border); border-radius:8px; margin:2px;}

  /* ---------- modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(9,14,28,.5); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;}
  .modal{background:var(--surface); border-radius:16px; box-shadow:var(--shadow-lg); width:100%; max-height:92vh; overflow-y:auto; border:1px solid var(--border);}
  .modal.w-narrow{max-width:420px;}
  .modal.w-lead{max-width:640px;}
  .modal.w-wide{max-width:920px;}
  .modal-head{display:flex; align-items:flex-start; gap:12px; padding:18px 20px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:var(--surface); border-radius:16px 16px 0 0; z-index:2;}
  .modal-head h2{font-size:16px;}
  .modal-head .sub{font-size:11.5px; color:var(--ink-faint); margin-top:3px;}
  .modal-close{margin-left:auto; border:none; background:var(--surface-2); width:28px;height:28px;border-radius:8px; cursor:pointer; color:var(--ink-dim); font-size:15px; flex:none;}
  .modal-body{padding:18px 20px;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--border-soft); display:flex; justify-content:flex-end; gap:8px; position:sticky; bottom:0; background:var(--surface);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  .kv{display:flex; flex-direction:column; gap:3px;}
  .kv .k{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint);}
  .kv .v{font-size:12.8px; font-weight:600;}
  .section-title{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint); margin:16px 0 8px;}
  .section-title:first-child{margin-top:0;}
  select.form-input, input.form-input, textarea.form-input{
    width:100%; border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:8px 9px;
    font-size:12.6px; color:var(--ink);
  }
  textarea.form-input{resize:vertical; min-height:60px;}
  .stage-row{display:flex; flex-wrap:wrap; gap:6px;}
  .stage-pill{border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer; color:var(--ink-dim);}
  .stage-pill.on{background:var(--navy); border-color:var(--navy); color:#fff;}
  .hist-list{display:flex; flex-direction:column; gap:6px;}
  .hist-item{display:flex; gap:8px; font-size:11.5px; color:var(--ink-dim);}
  .hist-item .d{color:var(--ink-faint); flex:none; width:100px;}

  /* import modal */
  .drop{
    border:2px dashed var(--border); border-radius:12px; padding:30px 16px; text-align:center;
    color:var(--ink-dim); cursor:pointer; font-size:12.5px;
  }
  .drop.hover{border-color:var(--accent); background:var(--accent-soft);}
  .import-summary{display:flex; flex-direction:column; gap:8px;}
  .import-row{display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:12.5px;}
  .import-row b{font-family:'Sora',sans-serif;}
  .import-tally{display:flex; gap:10px; font-size:11px; color:var(--ink-faint);}
  .import-tally b{color:var(--ink);}

  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:900; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--navy); color:#fff; padding:11px 16px; border-radius:10px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow-lg); max-width:340px;}
  .toast.err{background:var(--bad);}

  .db-sync-banner{background:#7a1f1f; color:#fff; font-size:12.5px; font-weight:600; padding:10px 18px; display:flex; align-items:center; gap:10px; line-height:1.4;}
  .db-sync-banner b{font-weight:800;}
  .db-sync-banner .db-sync-close{margin-left:auto; cursor:pointer; background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:6px; padding:3px 9px; font-size:11.5px; font-weight:700; flex:none;}

  .empty-state{padding:60px 20px; text-align:center; color:var(--ink-faint);}
  .empty-state h3{color:var(--ink); font-size:15px; margin-bottom:6px;}

  /* comparativo */
  .cmp-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:14px;}
  @media (max-width:960px){ .cmp-grid{grid-template-columns:1fr;} }
  .cmp-card{padding:16px;}
  .cmp-card h3{font-size:13px; margin-bottom:12px;}
  .legend{display:flex; gap:14px; font-size:11px; color:var(--ink-dim); margin-bottom:8px;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px; display:inline-block;}
  table.cmp-table{width:100%; border-collapse:collapse; font-size:12px;}
  table.cmp-table th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint); padding:6px 8px; border-bottom:1px solid var(--border);}
  table.cmp-table td{padding:7px 8px; border-bottom:1px solid var(--border-soft);}

  .spinner{width:16px;height:16px;border-radius:999px;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .save-indicator{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-faint);}
  .visually-hidden{position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:999px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<div id="authGateRoot"></div>
<div id="app" style="display:none;">
  <div id="dbSyncBanner" class="db-sync-banner" style="display:none;"></div>
  <div class="app-header-sticky" id="appHeaderSticky">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">D</div>
      <div class="brand-text"><b>Dellamed</b><span>Pipeline de Retenção</span></div>
    </div>
    <div class="searchwrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar por Razão Social, BP (Cód Cliente)" autocomplete="off">
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost-inverse" id="btnImport" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Importação
      </button>
      <button class="btn btn-ghost-inverse" id="btnExport">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 15V3m0 0 4 4m-4-4-4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Exportar
      </button>
      <button class="btn btn-ghost-inverse" id="btnRevertGanho" style="display:none;" title="Reverter todos os clientes em Ganho para Inativam no mês / Inativado">
        ↩ Reverter Ganho
      </button>
      <div class="user-chip" id="userChip" title="Clique para trocar de usuário" style="cursor:pointer;">
        <div class="user-avatar" id="userChipAvatar">—</div><span id="userChipName">—</span>
      </div>

function stripAccents(s){ return (s||"").normalize("NFD").replace(/\p{Diacritic}/gu,""); }
function norm(s){ return stripAccents(String(s||"")).toLowerCase().trim(); }
function todayLocal(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseISODate(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); if(!y) return null; return new Date(y,(m||1)-1,d||1); }
// Calendar-correct "add N months" — clamps the day to the last day of the
// target month instead of letting JS Date overflow into the month after
// (e.g. 31/jan + 1 mês vira 28/fev, não 03/mar).
function addMonthsSafe(d, months){
  const y = d.getFullYear();
  const mTotal = d.getMonth() + months;
  const targetY = y + Math.floor(mTotal/12);
  const targetM = ((mTotal%12)+12)%12;
  const daysInTarget = new Date(targetY, targetM+1, 0).getDate();
  return new Date(targetY, targetM, Math.min(d.getDate(), daysInTarget));
}
// Nova Regra de Inativação (playbook Dellamed): prazo de meses sem comprar até
// o cliente ser considerado inativo, por segmento. Usada para conferir se a
// Data de Inativação vinda do ERP está condizente com a Data Último
// Faturamento, ao processar o status "Recuperado com faturamento" na
// importação. Nomes de segmento são comparados de forma tolerante a acento/
// caixa/pontuação e a truncamentos do export (ex.: "DISTRIBUIDOR CIRÚRGI...").
const SEG_MESES_INATIVAR_RAW = {
  3:  ["LOJISTA OFF CIRURGIC","FARMA INDEPENDENTE","LOJISTA ON","DISTRIBUIDOR CIRURGI","FARMA REDES","FARMA DISTRIBUIDOR","FARMA ASSO-ECONOMIZE","REDE VAREJISTA OFF"],
  6:  ["HOSPITAIS/CLINICAS","PUBLICO INSTITUIÇÃO","POSTOS AUTORIZADOS","FUNERÁRIA","LOJISTA OFF NÃO CIRÚ"],
  12: ["LOJ. LICITAÇÃO","PUBLICO LICITAÇÃO","COMPRADOR OCASIONAL","COMPRADOR TERCEIRO","ORG. FILANTRÓPICA"]
};
function normSeg(s){ return norm(s).replace(/[.\-\/]/g," ").replace(/\s+/g," ").trim(); }
const SEG_MESES_LOOKUP = (()=>{
  const arr = [];
  Object.entries(SEG_MESES_INATIVAR_RAW).forEach(([meses, list])=>{
    list.forEach(s=> arr.push({meses:Number(meses), norm:normSeg(s)}));
  });
  arr.sort((a,b)=> b.norm.length - a.norm.length); // entradas mais específicas primeiro
  return arr;
})();
function mesesInativarPorSegmento(segRaw){
  if(!segRaw) return null;
  const s = normSeg(segRaw);
  if(!s) return null;
  let hit = SEG_MESES_LOOKUP.find(e=>e.norm===s);
  if(!hit) hit = SEG_MESES_LOOKUP.find(e=> s.startsWith(e.norm) || e.norm.startsWith(s));
  return hit ? hit.meses : null;
}

function isoDateLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtMoney(v){ v=Number(v||0); return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}); }
// Limiar (arbitrário, ajustável) acima do qual um Valor de Pedido é
// tratado como "suspeito" na tela do lead — normalmente sinal de erro de

function daysBetween(a,b){ return Math.round((a-b)/86400000); }
function daysUntil(dtISO){ const d=parseISODate(dtISO); if(!d) return null; return daysBetween(d, todayLocal()); }

function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function startOfWeek(d){ const day=(d.getDay()+6)%7; const s=new Date(d); s.setDate(d.getDate()-day); s.setHours(0,0,0,0); return s; }
function endOfWeekFn(d){ const s=startOfWeek(d); const e=new Date(s); e.setDate(s.getDate()+6); e.setHours(23,59,59,999); return e; }

// The `db` capability freezes every snapshot/data() it returns (by design —
// see db.d.ts: "don't mutate or accumulate them, clone a body before editing
// it"). Every read below hands the result straight to app code that DOES
// mutate leads in place (stage moves, manual edits, auto-transition to
// Inativo...), so every value coming out of dbNS is deep-cloned into a plain,
// writable object here. Without this, any direct mutation throws
// "Cannot assign to read only property" and silently aborts the load/render.
function cloneDeep(v){ return v==null ? v : JSON.parse(JSON.stringify(v)); }

// Abstraction over db capability with a localStorage fallback so the page
// still works (single-viewer, this-browser-only) if db isn't granted.
const Store = {
  async listMonths(){
    if(dbNS){
      const snap = await dbNS.collection("months").get();
      return snap.docs.map(d=>cloneDeep(d.data()));
    }
    const local = localLoad();
    return Object.values(local.months||{});
  },
  async getMeta(monthKey){
    if(dbNS){
      const snap = await dbNS.doc("months/"+monthKey).get();
      return snap.exists ? cloneDeep(snap.data()) : null;
    }
    const local = localLoad();
    return (local.months||{})[monthKey] || null;
  },
  async setMeta(monthKey, meta){
    if(dbNS){
      await dbNS.doc("months/"+monthKey).set(meta);
    }else{
      const local = localLoad(); local.months = local.months || {}; local.months[monthKey] = meta; localSave(local);
    }
  },
  async getChunk(monthKey, ci){
    if(dbNS){
      const snap = await dbNS.doc("months/"+monthKey+"/chunks/c"+ci).get();
      return snap.exists ? cloneDeep(snap.data()) : {leads:[]};
    }
    const local = localLoad();
    return ((local.chunks||{})[monthKey]||{})[ci] || {leads:[]};
  },
  async setChunk(monthKey, ci, data){
    if(dbNS){
      await dbNS.doc("months/"+monthKey+"/chunks/c"+ci).set(data);
    }else{
      const local = localLoad();
      local.chunks = local.chunks || {}; local.chunks[monthKey] = local.chunks[monthKey] || {};
      local.chunks[monthKey][ci] = data; localSave(local);
    }
  },
  async loadMonthLeads(monthKey){
    const meta = await Store.getMeta(monthKey);
    if(!meta) return {meta:null, leads:[]};
    const leads = [];
    for(let i=0;i<meta.chunkCount;i++){
      const c = await Store.getChunk(monthKey, i);
      leads.push(...(c.leads||[]));
    }
    leads.forEach(migrateLeadStatusKey);
    return {meta, leads};
  },
  async setAttachment(id, data){
    if(dbNS){
      await dbNS.doc("attachments/"+id).set(data);
    }else{
      const local = localLoad(); local.attachments = local.attachments || {}; local.attachments[id] = data; localSave(local);
    }
  },
  async getAttachment(id){
    if(dbNS){
      const snap = await dbNS.doc("attachments/"+id).get();
      return snap.exists ? cloneDeep(snap.data()) : null;
    }
    const local = localLoad();
    return (local.attachments||{})[id] || null;
  },
  // Marcadores de filtro (filter presets) salvos por e-mail de acesso —
  // ficam disponíveis para essa pessoa em qualquer navegador/computador em
  // que ela fizer login, já que vivem no mesmo banco compartilhado dos
  // leads (ou no localStorage local, no modo sem banco).
  async getFilterPresets(emailKey){
    if(dbNS){
      const snap = await dbNS.doc("filterPresets/"+emailKey).get();
      return snap.exists ? (cloneDeep(snap.data()).presets||[]) : [];
    }
    const local = localLoad();
    return ((local.filterPresets||{})[emailKey]) || [];
  },
  async setFilterPresets(emailKey, presets){
    if(dbNS){
      await dbNS.doc("filterPresets/"+emailKey).set({presets});
    }else{
      const local = localLoad();
      local.filterPresets = local.filterPresets || {};
      local.filterPresets[emailKey] = presets;
      localSave(local);
    }
  }
};

/* ============================= BUSINESS LOGIC ============================= */
// Recompute a lead's derived status/stage given fresh raw data pulled from an import.
// Preserves manual fields (acao, time, vendedor, ofensor, notes, and any stage the
// sales team already progressed beyond the automatic states).
// Vendedor is derived from whichever of these ERP columns is filled, in this
// priority order (per the retention playbook): Vendedor Interno (VE), Key
// Account (Z3), Prospect (Z5), then Representante (Z1). Time is then looked up
// from that vendedor name via TEAM_MAP.
function deriveVendedor(fresh){
  // Priority order per the retention playbook: Vendedor Interno (VE) → Key
  // Account (Z3) → Prospect (Z5) → Representante (Z1) → Sucesso do Cliente
  // (Z6) as a last resort, since a client is sometimes only tagged there.
  return fresh.vendInt || fresh.keyAcc || fresh.prospect || fresh.rep || fresh.sucCli || null;
}
function applyImportToLead(existing, fresh, monthKey){
  const now = nowISO();
  if(!existing){
    const derivedVendedor = deriveVendedor(fresh);
    const derivedTime = lookupTeam(derivedVendedor);
    return Object.assign({}, fresh, {
      stage: "inativam",
      status: "inativam",
      acao: null, time: derivedTime, vendedor: derivedVendedor, vendedorAuto: true, ofensor: null, ofensorDetalhe: null, notes: "",
      dtUltimoContato: null, dtProximoContato: null, horaProximoContato: null, valorProposta: null, linhasPositivadas: [],
      contatoDecisor: null, whatsapp: null, whatsappIndisponivel: false,
      baselineUltFat: fresh.dtUltFat,
      monthKey, createdAt: now, lastTouched: now, dataUpdatedAt: now,
      hist: [{d:now, t:"Importado"}]
    });
  }
  const derivedVendedor = deriveVendedor(fresh);
  const derivedTime = lookupTeam(derivedVendedor);
  // Only refresh Time/Vendedor automatically when they were auto-derived (or
  // never set) — a manual choice by the sales team is never overwritten by a
  // later import.
  const keepAuto = existing.vendedorAuto !== false;
  const merged = Object.assign({}, existing, fresh, {
    acao: existing.acao,
    time: keepAuto ? (derivedTime || existing.time) : existing.time,
    vendedor: keepAuto ? (derivedVendedor || existing.vendedor) : existing.vendedor,
    vendedorAuto: keepAuto,
    ofensor: existing.ofensor, ofensorDetalhe: existing.ofensorDetalhe || null,
    notes: existing.notes, baselineUltFat: existing.baselineUltFat,
    dtUltimoContato: existing.dtUltimoContato || null, dtProximoContato: existing.dtProximoContato || null,
    horaProximoContato: existing.horaProximoContato || null,
    valorProposta: existing.valorProposta || null, linhasPositivadas: existing.linhasPositivadas || [],
    contatoDecisor: existing.contatoDecisor || null, whatsapp: existing.whatsapp || null,
    whatsappIndisponivel: existing.whatsappIndisponivel || false,
    monthKey, createdAt: existing.createdAt, lastTouched: existing.lastTouched,
    dataUpdatedAt: now, stage: existing.stage
  });
  const computed = computeStatusStage(merged);
  merged.status = computed.status;
  merged.stage = computed.stage;
  merged.hist = existing.hist || [];
  pushHist(merged, "Atualizado via importação (status: "+STATUS_LABEL[computed.status]+")");
  if(computed.note) pushHist(merged, computed.note);
  return merged;
}

// One-time migration for leads persisted before the Status vocabulary was
// consolidated (pendente/impedido/recuperado → inativam/ganho). Runs on every
// load so old data displays correctly without requiring a re-import.
const STATUS_KEY_MIGRATION = {pendente:"inativam", impedido:"ganho", recuperado:"ganho"};
function migrateLeadStatusKey(lead){
  if(lead && STATUS_KEY_MIGRATION[lead.status]) lead.status = STATUS_KEY_MIGRATION[lead.status];
  return lead;
}

// Regra de recuperação automática na importação. O lead SÓ é movimentado
// automaticamente em dois casos, ambos vindos do campo "Status Atual" (ERP):
//   • "Recuperado com faturamento" — só vira Ganho se a Data de Inativação
//     bater com Data Último Faturamento + prazo do segmento (Nova Regra de
//     Inativação, SEG_MESES_INATIVAR_RAW acima).
//   • "Recuperado com pedido" — só vira Ganho se a Data de Inativação cair
//     dentro do mês atual.
// "Inativo" continua forçando Perdido/Inativado (regra já existente antes
// desta mudança). Qualquer OUTRO valor de Status Atual (incluindo vazio,
// "Ativo" etc.) NÃO movimenta o lead — ele permanece exatamente no estágio/
// status em que já estava.
const STATUS_ERP_RECUPERADO_FATURAMENTO = "recuperado com faturamento";
const STATUS_ERP_RECUPERADO_PEDIDO = "recuperado com pedido";
function computeStatusStage(lead){
  let status = lead.status || "inativam";
  let stage = lead.stage || "inativam";
  let note = null;
  const statusErpNorm = norm(lead.statusErp || "");

  if(lead.statusErp === "Inativo"){
    return {status:"perdido", stage:"inativo", note:null};
  }

  if(statusErpNorm === STATUS_ERP_RECUPERADO_FATURAMENTO){
    const meses = mesesInativarPorSegmento(lead.seg);
    const dtUltFat = parseISODate(lead.dtUltFat);
    const dtInat = parseISODate(lead.dtInat);
    if(meses!=null && dtUltFat && dtInat){
      const esperado = addMonthsSafe(dtUltFat, meses);
      const condizente = esperado.getFullYear()===dtInat.getFullYear() && esperado.getMonth()===dtInat.getMonth();
      if(condizente){
        status = "ganho"; stage = "ganho";
        note = `Recuperado com faturamento: Data de Inativação (${fmtDate(lead.dtInat)}) condizente com o prazo do segmento "${lead.seg||"—"}" (${meses} meses a partir do último faturamento em ${fmtDate(lead.dtUltFat)}) — movido automaticamente para Ganho.`;
      }else{
        const esperadoIso = esperado.getFullYear()+"-"+String(esperado.getMonth()+1).padStart(2,"0")+"-"+String(esperado.getDate()).padStart(2,"0");
        note = `Status ERP "Recuperado com faturamento" recebido, mas a Data de Inativação (${fmtDate(lead.dtInat)}) não bate com o prazo do segmento "${lead.seg||"—"}" (${meses} meses a partir de ${fmtDate(lead.dtUltFat)}, esperado ~${fmtDate(esperadoIso)}) — não movido automaticamente, revisar manualmente.`;
      }
    }else{
      const motivo = meses==null ? `segmento "${lead.seg||"—"}" não reconhecido na Nova Regra de Inativação` : "Data Último Faturamento ou Data de Inativação ausente";
      note = `Status ERP "Recuperado com faturamento" recebido, mas não foi possível conferir a regra (${motivo}) — não movido automaticamente, revisar manualmente.`;
    }
  }else if(statusErpNorm === STATUS_ERP_RECUPERADO_PEDIDO){
    const dtInat = parseISODate(lead.dtInat);
    const t = todayLocal();
    const condizente = dtInat && dtInat.getFullYear()===t.getFullYear() && dtInat.getMonth()===t.getMonth();
    if(condizente){
      status = "ganho"; stage = "ganho";
      note = `Recuperado com pedido: Data de Inativação (${fmtDate(lead.dtInat)}) dentro do mês atual — movido automaticamente para Ganho.`;
    }else{
      note = `Status ERP "Recuperado com pedido" recebido, mas a Data de Inativação (${fmtDate(lead.dtInat)}) não está no mês atual — não movido automaticamente, revisar manualmente.`;
    }
  }
  // Qualquer outro Status Atual (ERP) não movimenta o lead: status/stage
  // permanecem os mesmos já definidos no início da função.
  return {status, stage, note};
}

// Classificação por estágio da negociação (não mais por prazo até a
// inativação): Negociando = quente, Proposta enviada = morno, Negociação
// Perdida = frio.
function temperature(lead){
  if(lead.stage==="negociando") return "quente";
  if(lead.stage==="proposta") return "morno";
  if(lead.stage==="perdido") return "frio";
  return null;
}
const TEMP_COLOR = {quente:"var(--bad)", morno:"var(--warn)", frio:"var(--accent)"};
const TEMP_LABEL = {quente:"Quente", morno:"Morno", frio:"Frio"};

// Which extra fields must be filled before a stage move is allowed to commit.
// "obs" (a fresh observation) is required on every move, per the rule that the
// history must show what happened at every movement.
function requiredFieldsForMove(fromStage, toStage){
  const req = ["obs"];
  // Sempre que o lead sai de "Inativam no mês" ou "Inativado" para qualquer
  // outro estágio, o CRM (resumo do contato), as datas de último/próximo
  // contato (com horário do próximo) e os dados do decisor (nome + WhatsApp)
  // precisam ser registrados. Todo "dtProximoContato" exigido também exige o
  // horário correspondente (horaProximoContato) — os dois andam juntos.
  const leavingInativo = (fromStage==="inativam" || fromStage==="inativo");
  if(leavingInativo){
    req.push("dtUltimoContato","dtProximoContato","horaProximoContato","contatoDecisor","whatsapp");
  }
  if(toStage==="contato"){
    req.push("dtUltimoContato","dtProximoContato","horaProximoContato");
  }else if(toStage==="proposta"){
    req.push("valorProposta","linhasPositivadas");
    if(fromStage==="inativam") req.push("dtUltimoContato","dtProximoContato","horaProximoContato");
  }else if(toStage==="negociando"){
    req.push("valorProposta","linhasPositivadas");
    if(fromStage==="inativam") req.push("dtUltimoContato","dtProximoContato","horaProximoContato");
  }else if(toStage==="perdido"){
    req.push("dtUltimoContato","dtProximoContato","horaProximoContato","ofensor");
  }
  return Array.from(new Set(req));
}
// Ofensor values that open an extra, mandatory detail form.
const OFENSOR_DETAIL_KIND = {
  "Preço":"preco", "Concorrência":"preco",
  "Giro":"giro", "Estoque":"estoque",
  "Sem contato":"meios", "Sem retorno":"meios"
};

function isStale(lead){
  if(["ganho","perdido","inativo"].includes(lead.stage)) return false;
  const t = lead.lastTouched ? new Date(lead.lastTouched) : null;
  if(!t) return false;
  return daysBetween(new Date(), t) >= 7;
}

/* ---- shortcut predicates ---- */
const SHORTCUTS = [
  {key:"hoje", label:"Inativam hoje", dot:"var(--bad)", test:(l)=>{
    const d=parseISODate(l.dtInat); if(!d) return false; const t=todayLocal();
    return d.getTime()===t.getTime();
  }},
  {key:"semana_passada", label:"Já inativaram na semana", dot:"var(--ink-faint)", test:(l)=>{
    const d=parseISODate(l.dtInat); if(!d) return false; const t=todayLocal();
    return d.getTime() >= startOfWeek(new Date()).getTime() && d.getTime() <= t.getTime();
  }},
  {key:"ate_sexta", label:"Vão inativar até sexta", dot:"var(--warn)", test:(l)=>{
    const d=parseISODate(l.dtInat); if(!d) return false; const t=todayLocal(); const f=upcomingFriday(new Date());
    return l.status==="inativam" && d.getTime()>=t.getTime() && d.getTime()<=f.getTime();
  }},
  {key:"sem_att", label:"Sem atualização 7d+", dot:"var(--ink-faint)", test:(l)=> isStale(l)},
  {key:"quente", label:"Leads quentes", dot:"var(--bad)", test:(l)=> temperature(l)==="quente"},
  {key:"morno", label:"Leads mornos", dot:"var(--warn)", test:(l)=> temperature(l)==="morno"},
  {key:"frio", label:"Leads frios", dot:"var(--accent)", test:(l)=> temperature(l)==="frio"},
  {key:"recup_pedido", label:"Recuperado com pedido", dot:"var(--good)", test:(l)=> norm(l.statusErp||"")===STATUS_ERP_RECUPERADO_PEDIDO},
  {key:"recup_faturamento", label:"Recuperado com faturamento", dot:"var(--good)", test:(l)=> norm(l.statusErp||"")===STATUS_ERP_RECUPERADO_FATURAMENTO}
];

/* ============================= FILTERING ============================= */
// skipShortcut lets the shortcut chips themselves count against every other
// active filter (period, ação, time, vendedor, status, segmento, UF, ofensor,
// busca) without also being narrowed by whichever shortcut happens to be
// selected right now — otherwise every chip's count would collapse to
// whatever the currently-active chip matches instead of showing what each
// option would yield if clicked.
function matchesFilters(l, skipShortcut, ignoreStatus){
  const f = state.filters;
  if(f.periodo.size && !f.periodo.has(l.dtInat)) return false;
  if(f.dtinat.size && !f.dtinat.has(l.dtInat)) return false;
  if(f.acao.size && !f.acao.has(l.acao||"—")) return false;
  if(f.time.size && !f.time.has(l.time||"—")) return false;
  if(f.vendedor.size && !f.vendedor.has(l.vendedor||"—")) return false;
  if(!ignoreStatus && f.status.size && !f.status.has(STATUS_VIRTUAL_TODOS_MES) && !f.status.has(l.status)) return false;
  if(f.seg.size && !f.seg.has(l.seg||"—")) return false;
  if(f.uf.size && !f.uf.has(l.uf||"—")) return false;
  if(f.ofensor.size && !f.ofensor.has(l.ofensor||"—")) return false;
  // Seleção em massa (lupa de pesquisa por Cód Cliente): quando há alguma
  // seleção ativa, o quadro mostra só os clientes selecionados.
  if(state.bulkSelected && state.bulkSelected.size && !state.bulkSelected.has(l.cod)) return false;
  if(!skipShortcut && state.shortcut){
    const sc = SHORTCUTS.find(s=>s.key===state.shortcut);
    if(sc && !sc.test(l)) return false;
  }
  if(state.search){
    const q = norm(state.search);
    const hay = norm((l.cod||"")+" "+(l.cli||""));
    if(!hay.includes(q)) return false;
  }
  return true;
}
function currentFiltered(){ return state.leads.filter(l=>matchesFilters(l, false)); }
// Leads honoring every active filter/search, but not the shortcut selection
// itself — the base set the shortcut chip counters are computed against.
function leadsForShortcutCounts(){ return state.leads.filter(l=>matchesFilters(l, true)); }
// Leads honoring todos os filtros ativos (vendedor, time, segmento, UF,
// período, ofensor, busca, atalho) EXCETO o filtro de Status — usado pela
// meta "Impedi de inativar", que precisa sempre calcular 70% da base total
// de clientes elegíveis, e não do subconjunto que sobra depois de já
// filtrar por Status = Ganho (o que fazia a meta aparecer artificialmente
// em 100%).
function leadsIgnoringStatusFilter(){ return state.leads.filter(l=>matchesFilters(l, false, true)); }

/* ============================= MARCADORES DE FILTRO ============================= *
 * Combinações de filtros salvas por e-mail de acesso ("dentro do meu
 * acesso"), para reaplicar com um clique sempre que quiser. Ficam no mesmo
 * banco compartilhado dos leads (Store.getFilterPresets/setFilterPresets),
 * então continuam disponíveis pra essa pessoa em qualquer navegador em que
 * ela fizer login — não é algo preso a um computador específico.
 */
function serializeCurrentFilters(){
  const out = {};
  Object.keys(state.filters).forEach(k=>{ out[k] = Array.from(state.filters[k]); });
  return out;
}
function filterPresetIsEmpty(filtersObj){
  return Object.values(filtersObj||{}).every(arr=>!arr || !arr.length);
}
async function loadFilterPresetsForCurrentIdentity(){
  const identity = state.agendaIdentity;
  if(!identity || !identity.email){ state.filterPresets = []; state.filterPresetsLoadedFor = null; return; }
  try{
    state.filterPresets = await Store.getFilterPresets(identity.email);
  }catch(e){ console.error(e); state.filterPresets = []; }
  state.filterPresetsLoadedFor = identity.email;
}
async function saveCurrentFiltersAsPreset(name){
  const identity = state.agendaIdentity;
  if(!identity || !identity.email) return null;
  const trimmed = String(name||"").trim();
  if(!trimmed) return null;
  const filtersSnapshot = serializeCurrentFilters();
  if(filterPresetIsEmpty(filtersSnapshot)){
    toast("Selecione ao menos um filtro antes de salvar um marcador.", "err");
    return null;
  }
  const preset = {
    id: "fp_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),
    name: trimmed,
    filters: filtersSnapshot,
    createdAt: nowISO()
  };
  state.filterPresets = [...state.filterPresets, preset];
  await Store.setFilterPresets(identity.email, state.filterPresets);
  return preset;
}
async function deleteFilterPreset(id){
  const identity = state.agendaIdentity;
  if(!identity || !identity.email) return;
  state.filterPresets = state.filterPresets.filter(p=>p.id!==id);
  await Store.setFilterPresets(identity.email, state.filterPresets);
}
function applyFilterPreset(preset){
  Object.keys(state.filters).forEach(k=>{
    state.filters[k] = new Set((preset.filters||{})[k]||[]);
  });
  state.shortcut = null;
  state.bulkSelected = new Set();
  closePopover();
  renderAll();
  toast(`Marcador "${preset.name}" aplicado.`);
}

/* ============================= RENDER: FILTER BAR ============================= */
function uniqSorted(arr){ return Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>a.localeCompare(b,'pt')); }

function buildFilterField(container, key, title, options, colorFn, searchPlaceholder){
  const wrap = document.createElement("div");
  wrap.className = "field";
  const active = state.filters[key];
  wrap.innerHTML = `<label><span>${title}</span>${active.size ? `<button type="button" class="field-clear" data-clearkey="${key}" title="Limpar filtro de ${title}">✕ limpar</button>` : ""}</label>
    <button type="button" class="select-btn ${active.size?'has-value':''}" data-filterkey="${key}">
      <span>${active.size ? active.size+" selecionado(s)" : "Todos"}</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
    </button>`;
  container.appendChild(wrap);
  wrap.querySelector(".select-btn").addEventListener("click", (e)=>{
    openMultiPopover(e.currentTarget, key, options, colorFn, searchPlaceholder);
  });
  const clearBtn = wrap.querySelector(".field-clear");
  if(clearBtn){
    clearBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      active.clear();
      closePopover();
      renderAll();
    });
  }
}

let dragSelect = null; // {mode, key, active, options, colorFn, placeholder} while a drag-select is in progress
function openMultiPopover(anchor, key, options, colorFn, searchPlaceholder){
  closePopover();
  const pop = document.createElement("div");
  pop.className = "popover";
  pop.id = "activePopover";
  const active = state.filters[key];
  const counts = {};
  state.leads.forEach(l=>{
    let v;
    if(key==="periodo") v = l.dtInat;
    else if(key==="dtinat") v = l.dtInat;
    else if(key==="status") v = l.status;
    else if(key==="acao") v = l.acao||"—";
    else if(key==="time") v = l.time||"—";
    else if(key==="vendedor") v = l.vendedor||"—";
    else if(key==="seg") v = l.seg||"—";
    else if(key==="uf") v = l.uf||"—";
    else if(key==="ofensor") v = l.ofensor||"—";
    counts[v] = (counts[v]||0)+1;
    // "Inativariam no mês" é virtual — conta todo mundo do mês, não importa
    // o status real de cada lead.
    if(key==="status") counts[STATUS_VIRTUAL_TODOS_MES] = (counts[STATUS_VIRTUAL_TODOS_MES]||0)+1;
  });
  const searchable = options.length > 3;
  pop.innerHTML =
    (searchable ? `<input type="text" class="form-input" id="popSearch" placeholder="${escapeHtml(searchPlaceholder||"Buscar por nome...")}" style="margin-bottom:6px;">` : "") +
    `<div id="popList" style="user-select:none;">` + options.map(opt=>{
      const val = typeof opt==="object" ? opt.key : opt;
      const lbl = typeof opt==="object" ? opt.label : opt;
      const checked = active.has(val) ? "checked" : "";
      const dot = colorFn ? `<span class="tag-dot" style="background:${colorFn(val)}"></span>` : "";
      const n = counts[val]||0;
      return `<div class="popover-item" data-val="${escapeHtml(val)}" data-search="${escapeHtml(norm(lbl))}"><input type="checkbox" style="pointer-events:none;" ${checked}>${dot}<span>${escapeHtml(lbl)}</span><span class="n">${n}</span></div>`;
    }).join("") + `</div>`;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const maxLeft = window.innerWidth - Math.min(pop.offsetWidth || 260, window.innerWidth-16);
  pop.style.left = Math.max(8, Math.min(r.left, maxLeft)) + "px";
  pop.style.top = (r.bottom+6) + "px";

  function refreshAfterDrag(){
    renderAll();
    const btn = document.querySelector(`[data-filterkey="${key}"]`);
    if(btn) openMultiPopover(btn, key, options, colorFn, searchPlaceholder);
  }
  function onDragEnd(){
    document.removeEventListener("mouseup", onDragEnd);
    if(dragSelect){ dragSelect = null; refreshAfterDrag(); }
  }
  // Click-and-drag multi-select: mousedown on an item starts a drag whose
  // "paint mode" (checking vs unchecking) is set by that first item; dragging
  // over other items (mouse held down) applies the same mode to each.
  pop.querySelectorAll(".popover-item").forEach(item=>{
    const val = item.getAttribute("data-val");
    const cb = item.querySelector("input[type=checkbox]");
    item.addEventListener("mousedown", (e)=>{
      e.preventDefault();
      const mode = !cb.checked;
      cb.checked = mode;
      if(mode) active.add(val); else active.delete(val);
      dragSelect = {mode};
      document.addEventListener("mouseup", onDragEnd);
    });
    item.addEventListener("mouseenter", ()=>{
      if(!dragSelect) return;
      cb.checked = dragSelect.mode;
      if(dragSelect.mode) active.add(val); else active.delete(val);
    });
    // Prevent the click that follows mousedown/mouseup from bubbling to the
    // document-level outsideClosePopover listener. Without this, a plain
    // click (mousedown+mouseup with no drag) rebuilds the popover *before*
    // the click event fires; the click's target is then a detached node from
    // the old (already-removed) popover, which outsideClosePopover fails to
    // recognize as "inside", closing the freshly-reopened popover instantly.
    item.addEventListener("click", (e)=>{ e.stopPropagation(); });
  });
  const searchInput = document.getElementById("popSearch");
  if(searchInput){
    searchInput.addEventListener("mousedown", e=>e.stopPropagation());
    searchInput.addEventListener("click", e=>e.stopPropagation());
    searchInput.addEventListener("input", ()=>{
      const q = norm(searchInput.value);
      pop.querySelectorAll(".popover-item").forEach(item=>{
        item.style.display = item.getAttribute("data-search").includes(q) ? "" : "none";
      });
    });
    setTimeout(()=>searchInput.focus(), 0);
  }
  setTimeout(()=>document.addEventListener("click", outsideClosePopover, {once:false}), 0);
}
function outsideClosePopover(e){
  const pop = document.getElementById("activePopover");
  if(!pop) return;
  if(pop.contains(e.target) || e.target.closest("[data-filterkey]")) return;
  closePopover();
}
function closePopover(){
  const pop = document.getElementById("activePopover");
  if(pop) pop.remove();
  document.removeEventListener("click", outsideClosePopover);
}

  pop.innerHTML = `

    ${presets.length ? presets.map(p=>`

        <button type="button" class="fp-delete" data-preset-id="${escapeHtml(p.id)}" title="Excluir marcador" style="border:none; background:none; cursor:pointer; color:var(--ink-faint); padding:2px; font-size:13px; line-height:1;">✕</button>
      </div>`).join("") : `<div style="padding:6px 8px; font-size:12px; color:var(--ink-faint);">Nenhum marcador salvo ainda.</div>`}
    <div style="border-top:1px solid var(--border-soft); margin-top:6px; padding-top:8px;">
      ${hasActiveFilters ? `
        <input type="text" class="form-input" id="fpNewName" placeholder="Nome do marcador..." style="margin-bottom:6px; font-size:12.5px; width:100%; box-sizing:border-box;">
        <button type="button" class="btn btn-primary" id="fpSaveBtn" style="width:100%; justify-content:center;">+ Salvar filtro atual</button>
      ` : `<div style="font-size:11.5px; color:var(--ink-faint); padding:0 4px;">Selecione algum filtro na barra para poder salvar um marcador.</div>`}
    </div>
  `;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const maxLeft = window.innerWidth - Math.min(pop.offsetWidth || 260, window.innerWidth-16);
  pop.style.left = Math.max(8, Math.min(r.left, maxLeft)) + "px";
  pop.style.top = (r.bottom+6) + "px";

  pop.querySelectorAll(".fp-item").forEach(item=>{
    item.addEventListener("click", (e)=>{
      if(e.target.closest(".fp-delete")) return;
      const preset = presets.find(p=>p.id===item.dataset.presetId);
      if(preset) applyFilterPreset(preset);
    });
  });
  pop.querySelectorAll(".fp-delete").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.presetId;
      await deleteFilterPreset(id);
      closePopover();
      renderFilterbar();
    });
  });
  const saveBtn = document.getElementById("fpSaveBtn");
  const nameInput = document.getElementById("fpNewName");
  if(saveBtn){
    saveBtn.addEventListener("click", async ()=>{
      const name = nameInput ? nameInput.value : "";
      if(!name.trim()){ toast("Dê um nome para o marcador.", "err"); return; }
      saveBtn.disabled = true;
      const preset = await saveCurrentFiltersAsPreset(name);
      if(preset){
        closePopover();
        renderFilterbar();
        toast(`Marcador "${preset.name}" salvo.`);
      }else{
        saveBtn.disabled = false;
      }
    });
  }
  if(nameInput){
    nameInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); if(saveBtn) saveBtn.click(); } });
    setTimeout(()=>nameInput.focus(), 0);
  }
  setTimeout(()=>document.addEventListener("click", outsideClosePopover, {once:false}), 0);
}
