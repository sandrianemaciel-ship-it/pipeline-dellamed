// Requirement: um lead ainda parado em "Inativam no mês" (o vendedor nunca o
// movimentou manualmente) cuja data de inativação já tenha chegado deve ser
// automaticamente movido para "Inativo". Se o vendedor já tiver movimentado o
// lead para qualquer outro estágio, esta regra nunca se aplica (o progresso
// manual nunca é sobrescrito).
async function applyAutoInativoTransitions(){
  if(!state.meta || !state.leads.length) return;
  const touchedChunks = new Set();
  let anyChange = false;
  state.leads.forEach(l=>{
    if(l.stage==="inativam"){
      const d = daysUntil(l.dtInat);
      if(d!=null && d<=0){
        l.stage = "inativo";
        l.lastTouched = nowISO();
        pushHist(l, `Movido automaticamente para "Inativado" — data de inativação (${fmtDate(l.dtInat)}) já foi atingida.`);
        anyChange = true;
        const ci = state.meta.codToChunk ? state.meta.codToChunk[l.cod] : null;
        if(ci!=null) touchedChunks.add(ci);
      }
    }
  });
  if(!anyChange) return;
  for(const ci of touchedChunks){
    try{
      const chunk = await Store.getChunk(state.monthKey, ci);
      (chunk.leads||[]).forEach((cl, idx)=>{
        const updated = state.leads.find(l=>l.cod===cl.cod);
        if(updated) chunk.leads[idx] = updated;
      });
      await Store.setChunk(state.monthKey, ci, chunk);
    }catch(err){ console.error(err); }
  }
  if(state._monthCache && state._monthCache[state.monthKey]) state._monthCache[state.monthKey].leads = state.leads;
}

// Correção automática de Valor de Pedido corrompido — sem exigir edição
// manual. Alguns registros vieram da base ERP com dígitos a mais nesse campo
// (ex: R$ 11.058.400.000.000 em vez de R$ 1.105,84): matematicamente, isso
// bate com o valor certo (em centavos) seguido de zeros sobrando à direita.
// Só age quando o valor está acima de um teto extremamente alto (R$ 1
// bilhão) — nenhum cliente desta base tem um pedido real nessa ordem de
// grandeza — para nunca arriscar mexer num valor grande porém verdadeiro.
// A correção: remove os zeros à direita e reinterpreta os 2 últimos dígitos
// restantes como centavos.
const VALOR_PEDIDO_AUTOFIX_CEILING = 1000000000; // R$ 1 bilhão
function autoFixValorPedido(value){
  let v = Math.round(Number(value)||0);
  if(v <= VALOR_PEDIDO_AUTOFIX_CEILING) return null; // não é um caso óbvio de corrupção — não mexe
  while(v > 0 && v % 10 === 0) v = v/10;
  const fixed = v / 100;
  return (fixed > 0 && fixed <= VALOR_PEDIDO_AUTOFIX_CEILING) ? fixed : null;
}
async function applyAutoValorPedidoFix(){
  if(!state.meta || !state.leads.length) return;
  const touchedChunks = new Set();
  let anyChange = false;
  state.leads.forEach(l=>{
    const fixed = autoFixValorPedido(l.valorPedido);
    if(fixed!=null){
      const before = l.valorPedido;
      l.valorPedido = fixed;
      l.lastTouched = nowISO();
      pushHist(l, `Valor de pedido corrigido automaticamente de ${fmtMoney(before)} para ${fmtMoney(fixed)} — o valor vindo da base ERP tinha dígitos a mais.`);
      anyChange = true;
      const ci = state.meta.codToChunk ? state.meta.codToChunk[l.cod] : null;
      if(ci!=null) touchedChunks.add(ci);
    }
  });
  if(!anyChange) return;
  for(const ci of touchedChunks){
    try{
      const chunk = await Store.getChunk(state.monthKey, ci);
      (chunk.leads||[]).forEach((cl, idx)=>{
        const updated = state.leads.find(l=>l.cod===cl.cod);
        if(updated) chunk.leads[idx] = updated;
      });
      await Store.setChunk(state.monthKey, ci, chunk);
    }catch(err){ console.error(err); }
  }
  if(state._monthCache && state._monthCache[state.monthKey]) state._monthCache[state.monthKey].leads = state.leads;
}

/* ================= REVERSÃO DE GANHO =================
 * Ferramenta administrativa (só admins veem o botão) para tirar, em lote,
 * TODOS os clientes que estão em "Ganho" (independente de terem sido
 * movidos automaticamente pela importação ou manualmente pela equipe de
 * vendas) e reclassificá-los como "Inativam no mês" ou "Inativado" —
 * seguindo exatamente a mesma regra usada em applyAutoInativoTransitions:
 * se a Data de Inativação do cliente já chegou (hoje >= data de
 * inativação), ele volta para "Inativado"; caso contrário (data ainda não
 * chegou, ou o cliente não tem data de inativação cadastrada), ele volta
 * para "Inativam no mês".
 */
function determineRevertTargetStage(lead){
  const d = daysUntil(lead.dtInat);
  return (d!=null && d<=0) ? "inativo" : "inativam";
}
function isGanhoLead(lead){
  return !!lead && lead.stage==="ganho";
}
async function countGanhoLeads(){
  const months = await Store.listMonths();
  let total = 0, monthsAffected = 0;
  for(const meta of months){
    if(!meta || !meta.monthKey) continue;
    const {leads} = await Store.loadMonthLeads(meta.monthKey);
    const count = (leads||[]).filter(isGanhoLead).length;
    if(count>0){ total += count; monthsAffected++; }
  }
  return {total, months: monthsAffected};
}
async function revertGanhoLeads(){
  const months = await Store.listMonths();
  const ganhoLabel = STAGES.find(s=>s.key==="ganho").label;
  let totalReverted = 0, totalInativado = 0, totalInativam = 0, monthsAffected = 0;
  for(const meta of months){
    if(!meta || !meta.monthKey) continue;
    const monthKey = meta.monthKey;
    const {leads} = await Store.loadMonthLeads(monthKey);
    const touchedChunks = new Set();
    let monthCount = 0;
    (leads||[]).forEach(l=>{
      if(!isGanhoLead(l)) return;
      const targetStage = determineRevertTargetStage(l);
      const toLabel = STAGES.find(s=>s.key===targetStage).label;
      l.stage = targetStage;
      l.status = targetStage; // "inativam"/"inativo" existem em ambos STAGES e STATUS_OPTIONS
      l.lastTouched = nowISO();
      pushHist(l, `Revertido de "${ganhoLabel}" para "${toLabel}" — reclassificação em lote conforme a Data de Inativação do cliente.`);
      monthCount++; totalReverted++;
      if(targetStage==="inativo") totalInativado++; else totalInativam++;
      const ci = meta.codToChunk ? meta.codToChunk[l.cod] : null;
      if(ci!=null) touchedChunks.add(ci);
    });
    if(monthCount>0){
      monthsAffected++;
      for(const ci of touchedChunks){
        try{
          const chunk = await Store.getChunk(monthKey, ci);
          (chunk.leads||[]).forEach((cl, idx)=>{
            const updated = leads.find(l=>l.cod===cl.cod);
            if(updated) chunk.leads[idx] = updated;
          });
          await Store.setChunk(monthKey, ci, chunk);
        }catch(err){ console.error(err); }
      }
    }
  }
  // Recarrega o mês atualmente aberto (se afetado) para refletir a mudança na tela.
  if(state.meta && state.monthKey){
    const {meta: freshMeta, leads: freshLeads} = await Store.loadMonthLeads(state.monthKey);
    if(freshMeta){
      state.meta = freshMeta;
      state.leads = freshLeads;
      if(state._monthCache && state._monthCache[state.monthKey]) state._monthCache[state.monthKey].leads = freshLeads;
    }
  }
  return {totalReverted, totalInativado, totalInativam, monthsAffected};
}
function openRevertGanhoModal(){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
  <div class="overlay" id="revertGanhoOverlay">
    <div class="modal w-lead">
      <div class="modal-head">
        <div><h2>Reverter clientes em Ganho</h2><div class="sub">Reclassifica todos os clientes de "Ganho" para "Inativam no mês" ou "Inativado"</div></div>
        <button class="modal-close" id="revertGanhoClose">✕</button>
      </div>
      <div class="modal-body">
        <p style="margin:0; line-height:1.5;">Verificando clientes em "Ganho"...</p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-subtle" id="revertGanhoCancel">Fechar</button>
      </div>
    </div>
  </div>`;
  document.getElementById("revertGanhoClose").onclick = closeModal;
  document.getElementById("revertGanhoCancel").onclick = closeModal;
  document.getElementById("revertGanhoOverlay").addEventListener("click",(e)=>{ if(e.target.id==="revertGanhoOverlay") closeModal(); });
  countGanhoLeads().then(preview=>{
    const body = document.querySelector("#revertGanhoOverlay .modal-body");
    const foot = document.querySelector("#revertGanhoOverlay .modal-foot");
    if(!body || !foot) return; // modal já foi fechado
    if(preview.total===0){
      body.innerHTML = `<p style="margin:0; line-height:1.5;">Nenhum cliente encontrado em "Ganho".</p>`;
      return;
    }
    body.innerHTML = `
      <p style="margin:0 0 12px; line-height:1.5;">Foram encontrados <b>${preview.total}</b> cliente(s) em "Ganho", em ${preview.months} mês(es). Todos serão reclassificados: quem já passou da Data de Inativação vai para <b>"Inativado"</b>; quem ainda não chegou nessa data (ou não tem data cadastrada) vai para <b>"Inativam no mês"</b>.</p>
      <p style="margin:0; font-size:12.5px; color:var(--ink-faint); line-height:1.5;">Isso vale para TODOS os clientes em Ganho, inclusive os movidos manualmente pela equipe de vendas. Essa ação não pode ser desfeita automaticamente.</p>`;
    foot.innerHTML = `<button class="btn btn-subtle" id="revertGanhoCancel2">Cancelar</button><button class="btn btn-primary" id="revertGanhoConfirm">Reverter ${preview.total} cliente(s)</button>`;
    document.getElementById("revertGanhoCancel2").onclick = closeModal;
    document.getElementById("revertGanhoConfirm").onclick = async ()=>{
      const btn = document.getElementById("revertGanhoConfirm");
      btn.disabled = true; btn.textContent = "Revertendo...";
      try{
        const result = await revertGanhoLeads();
        closeModal();
        toast(`${result.totalReverted} cliente(s) revertido(s) com sucesso, em ${result.monthsAffected} mês(es) — ${result.totalInativado} para "Inativado" e ${result.totalInativam} para "Inativam no mês".`);
        renderAll();
      }catch(err){
        console.error(err);
        toast("Erro ao reverter. Tente novamente.", "err");
      }
    };
  }).catch(err=>{
    console.error(err);
    const body = document.querySelector("#revertGanhoOverlay .modal-body");
    if(body) body.innerHTML = `<p style="margin:0; line-height:1.5; color:var(--bad);">Erro ao verificar clientes. Tente novamente.</p>`;
  });
}

  if(!wrap) return;

  const sched = scheduleForWeekday(today.getDay());
  const dayNameFull = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"][today.getDay()];
  const quote = motivationalQuoteForToday();
  const quoteHtml = `
    <div class="ht-quote-wrap">
      <div class="ht-quote">💬 “${escapeHtml(quote)}”</div>
    </div>`;
  if(!sched){
    // Fim de semana: sem cronograma comercial, só a frase do dia.
    wrap.innerHTML = `

    return;

  wrap.innerHTML = `
    <div class="ht-day-chip">${sched.icon} ${dayNameFull}</div>

}

  document.querySelectorAll(".btn-nav[data-view]").forEach(btn=>{
    btn.classList.toggle("active", state.view===btn.dataset.view);

  document.querySelectorAll(".tab[data-view]").forEach(t=>{

function renderAll(){
  // Trava de identificação do app inteiro: enquanto a pessoa não informar
  // nome+e-mail (conferidos contra a lista de vendedores, ou um e-mail de
  // acesso total), ela só vê a tela de identificação — nada do app.
  const identity = ensureAgendaIdentity();
  const appEl = document.getElementById("app");
  const gateEl = document.getElementById("authGateRoot");
  if(!identity){
    appEl.style.display = "none";
    renderAppGate();
    return;
  }
  gateEl.innerHTML = "";
  appEl.style.display = "";
  const chipAvatar = document.getElementById("userChipAvatar");
  const chipName = document.getElementById("userChipName");
  if(chipAvatar && chipName){
    const initials = (identity.displayName||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?";
    chipAvatar.textContent = initials;
    chipName.textContent = identity.displayName + (identity.isAdmin ? " · acesso total" : "");
  }
  const btnRevertGanho = document.getElementById("btnRevertGanho");
  if(btnRevertGanho) btnRevertGanho.style.display = identity.isAdmin ? "" : "none";
  // Importação de planilha liberada só para o e-mail de acesso definido em
  // IMPORT_ALLOWED_EMAIL — os demais usuários (inclusive outros e-mails de
  // acesso total) não veem o botão.
  const btnImportEl = document.getElementById("btnImport");
  if(btnImportEl) btnImportEl.style.display = identity.email===IMPORT_ALLOWED_EMAIL ? "" : "none";
  // Marcadores de filtro são carregados uma vez por identidade (assíncrono,
  // sem travar o resto do render); assim que chegam, só a barra de filtros
  // é re-renderizada para mostrá-los.
  if(state.filterPresetsLoadedFor !== identity.email){
    loadFilterPresetsForCurrentIdentity().then(()=>{ renderFilterbar(); });
  }
  renderHeaderTicker();
  updateNavButtonsActive();
  renderFilterbar();
  renderShortcuts();
  const headerStickyEl = document.getElementById("appHeaderSticky");
  if(headerStickyEl) headerStickyEl.classList.toggle("is-sticky", state.view==="dashboard" || state.view==="comparativo");
  document.getElementById("viewKanban").style.display = state.view==="kanban" ? "" : "none";
  document.getElementById("viewDashboard").style.display = state.view==="dashboard" ? "" : "none";
  document.getElementById("viewComparativo").style.display = state.view==="comparativo" ? "" : "none";
  document.getElementById("viewAgenda").style.display = state.view==="agenda" ? "" : "none";
  if(state.view==="kanban"){
    if(state.loading){
      document.getElementById("board").innerHTML = `<div class="panel empty-state" style="grid-column:1/-1;"><span class="spinner"></span></div>`;
    }else if(!state.meta || !state.leads.length){
      document.getElementById("board").innerHTML = `<div class="panel empty-state" style="grid-column:1/-1; width:100%;"><h3>Nenhum lead neste período</h3><p>Use "Importação" para carregar a planilha de clientes que inativam em ${fmtMonthKey(state.monthKey)}.</p></div>`;
    }else{
      renderBoard();
    }
  }else if(state.view==="dashboard"){
    // Fire-and-forget: renderDashboard() is async (a-la comparativo) because
    // the R$ reversion evolution chart iterates every tracked month.
    renderDashboard();
  }else if(state.view==="comparativo"){
    // Fire-and-forget: keeps the comparativo view in sync whenever a filter
    // changes while that tab is already open, not just on first tab click.
    renderComparativo();
  }else if(state.view==="agenda"){
    renderAgenda();
  }
}

/* ============================= LEMBRETES DE LIGAÇÃO (notificação do sistema) =============================
   Verifica a cada minuto se algum lead tem dtProximoContato+horaProximoContato
   batendo com o horário atual e dispara uma notificação do sistema operacional
   (Notification API) — não apenas um alerta dentro da aba da Pipeline — além
   de um toque sonoro simples via AudioContext. Cada lead só é notificado uma
   vez por minuto/execução (chave cod|data|hora registrada em state.notifiedKeys). */
function playReminderChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,180,360].forEach(delay=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine"; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.28);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime+0.3);
      }, delay);
    });
  }catch(err){ /* AudioContext indisponível — ignora silenciosamente */ }
}
function requestNotificationPermission(){
  if(typeof Notification==="undefined"){ toast("Este navegador não suporta notificações do sistema.", "err"); return; }
  Notification.requestPermission().then(p=>{
    state.notifPermission = p;
    if(p==="granted") toast("Lembretes de ligação ativados neste computador.", "ok");
    else toast("Sem permissão de notificação — os lembretes só aparecerão dentro da aba.", "err");
  });
}
function checkCallReminders(){
  if(!state.leads || !state.leads.length) return;
  const now = new Date();
  const todayStr = isoDateLocal(now);
  const hhmm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  state.leads.forEach(l=>{
    if(l.dtProximoContato!==todayStr || !l.horaProximoContato) return;
    if(l.horaProximoContato!==hhmm) return;
    const key = l.cod+"|"+l.dtProximoContato+"|"+l.horaProximoContato;
    if(state.notifiedKeys.has(key)) return;
    state.notifiedKeys.add(key);
    playReminderChime();
    if(typeof Notification!=="undefined" && Notification.permission==="granted"){
      try{
        const n = new Notification("📞 Ligação agendada agora — "+(l.cli||"Cliente"), {
          body: "Horário: "+l.horaProximoContato+(l.tel?" · Tel: "+l.tel:""),
          tag: key
        });
        n.onclick = ()=>{ window.focus(); openContactPopup(l.cod); };
      }catch(err){ console.error(err); }
    }else{
      toast("📞 Ligação agendada agora com "+(l.cli||"cliente")+" ("+l.horaProximoContato+")", "warn");
    }
  });
}
setInterval(checkCallReminders, 30000);

function renderDbSyncBanner(){
  // Se o Firestore não conectou (dbNS null — bloqueio de rede/firewall,
  // adblocker, ou o script do Firebase não carregou), este navegador NÃO
  // está conectado à base compartilhada da equipe: tudo que essa aba mostra
  // ou salva fica isolado no localStorage deste navegador/dispositivo. Sem
  // este aviso, isso aparece pro usuário como "não tem nenhum cliente" —
  // exatamente como se não houvesse nenhum lead importado, mesmo quando
  // existem centenas na base compartilhada. Avisamos de forma persistente
  // (não é um toast que some sozinho) para que a pessoa saiba que precisa
  // falar com quem administra o link, em vez de concluir que a base está
  // vazia.
  const el = document.getElementById("dbSyncBanner");
  if(!el) return;
  if(dbNS) { el.style.display = "none"; return; }
  el.innerHTML = '<span>⚠️ <b>Este navegador não conseguiu conectar à base compartilhada da equipe.</b> '
    + 'Os dados mostrados aqui (incluindo listas vazias) são apenas locais deste dispositivo — não é a base real da Dellamed. '
    + 'Verifique sua conexão com a internet ou avise a Sandriane.</span>'
    + '<button class="db-sync-close" type="button">Entendi</button>';
  el.style.display = "flex";
  const closeBtn = el.querySelector(".db-sync-close");
  if(closeBtn) closeBtn.onclick = ()=>{ el.style.display = "none"; };
}

async function boot(){
  renderDbSyncBanner();
  await loadMonths();
  await setMonth(TRACKING_START);
  if(typeof Notification!=="undefined" && Notification.permission==="default"){
    // Pede permissão de forma discreta, sem travar o carregamento inicial.
    setTimeout(()=>{ toast('Ative os lembretes de ligação em "Gestão de Contatos" para receber avisos mesmo fora da aba.', "info"); }, 1500);
  }
}
})();
