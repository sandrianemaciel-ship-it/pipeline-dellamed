function openBulkSearchPopover(anchor, stageKey){
  closePopover();
  const pop = document.createElement("div");
  pop.className = "popover";
  pop.id = "activePopover";
  pop.style.minWidth = "260px";
  const stageLabel = (STAGES.find(s=>s.key===stageKey)||{}).label || "";
  pop.innerHTML = `
    <div style="font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:6px;">Cole os Cód Cliente (um por linha, ou separados por vírgula) e pressione Enter para selecionar em massa em "${escapeHtml(stageLabel)}"</div>
    <textarea class="form-input" id="bulkSearchInput" rows="5" placeholder="Ex:\n1234\n5678\n9012" style="width:100%; resize:vertical;"></textarea>
    <div style="display:flex; gap:6px; margin-top:8px;">
      <button type="button" class="btn btn-primary" id="bulkSearchApply" style="flex:1;">Selecionar</button>
      <button type="button" class="btn btn-subtle" id="bulkSearchClear">Limpar seleção</button>
    </div>
  `;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const maxLeft = window.innerWidth - Math.min(pop.offsetWidth || 260, window.innerWidth-16);
  pop.style.left = Math.max(8, Math.min(r.left, maxLeft)) + "px";
  pop.style.top = (r.bottom+6) + "px";
  const ta = document.getElementById("bulkSearchInput");
  function applyBulk(){
    const codes = ta.value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
    if(!codes.length) return;
    const set = new Set(codes);
    state.bulkSelected = state.bulkSelected || new Set();
    let matched = 0;
    state.leads.forEach(l=>{ if(l.stage===stageKey && set.has(String(l.cod))){ state.bulkSelected.add(l.cod); matched++; } });
    toast(matched+" de "+codes.length+" cliente(s) selecionado(s) em massa.");
    closePopover();
    renderAll();
  }
  ta.addEventListener("keydown",(e)=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); applyBulk(); }
  });
  ta.addEventListener("mousedown", e=>e.stopPropagation());
  ta.addEventListener("click", e=>e.stopPropagation());
  document.getElementById("bulkSearchApply").addEventListener("click", applyBulk);
  document.getElementById("bulkSearchClear").addEventListener("click", ()=>{
    state.bulkSelected = new Set();
    closePopover();
    renderAll();
  });
  setTimeout(()=>ta.focus(), 0);
  setTimeout(()=>document.addEventListener("click", outsideClosePopover, {once:false}), 0);
}

function renderFilterbar(){
  const bar = document.getElementById("filterbar");
  bar.innerHTML = "";
  // Mês (which month bucket is loaded — this is the storage/loading boundary)
  const monthField = document.createElement("div");
  monthField.className = "field";
  const monthOptions = getAllMonthOptions();
  monthField.innerHTML = `<label>Mês (base)</label>
    <select class="select-btn month-select" id="monthSelect">
      ${monthOptions.map(mk=>`<option value="${mk}" ${mk===state.monthKey?"selected":""}>${fmtMonthKey(mk)}</option>`).join("")}
    </select>`;
  bar.appendChild(monthField);
  monthField.querySelector("select").addEventListener("change", (e)=>{
    setMonth(e.target.value);
  });

  // Data de inativação: só lista as datas de inativação que de fato existem na
  // base carregada (mês selecionado acima em "Mês (base)"), priorizando os
  // clientes que ainda vão inativar no mês; se essa base estiver vazia, cai
  // para todas as datas de inativação presentes no mês carregado.
  const dtInatSource = (()=>{
    const inativamLeads = state.leads.filter(l=>l.stage==="inativam" && l.dtInat);
    return inativamLeads.length ? inativamLeads : state.leads.filter(l=>l.dtInat);
  })();
  const dtInatOptions = uniqSorted(dtInatSource.map(l=>l.dtInat))
    .sort((a,b)=>a.localeCompare(b))
    .map(iso=>({key:iso, label:fmtDate(iso)}));
  buildFilterField(bar, "dtinat", "Data de inativação", dtInatOptions, null, "Buscar por data (ex: 03/09/2026)");

  // Período: multi-select (click-and-drag) of calendar dates, 01/09/2026 through 31/12/2027
  buildFilterField(bar, "periodo", "Período", PERIODO_DATE_OPTIONS, null, "Buscar por data (ex: 03/09 ou 2026)");

  buildFilterField(bar, "acao", "Ação", ACAO_OPTIONS);
  buildFilterField(bar, "time", "Time", TIME_OPTIONS);
  // Only list vendedores that actually occur among the loaded leads (derived from
  // Vendedor Interno/Key Account/Prospect/Representante). Mixing in the raw team
  // roster names here caused "phantom" options whose exact spelling doesn't match
  // the ERP export, which always matched 0 leads when selected.
  // Cascading: when one or more Times are selected in the Time filter, only
  // vendedores belonging to those teams (among the current leads) are listed.
  const leadsForVendedor = state.filters.time.size
    ? state.leads.filter(l=> state.filters.time.has(l.time||"—"))
    : state.leads;
  const vendedorOptions = uniqSorted(leadsForVendedor.map(l=>l.vendedor));
  // Prune any previously-selected vendedor that's no longer valid for the
  // selected team(s), so the active filter and the option list stay in sync.
  if(state.filters.time.size){
    const allowed = new Set(vendedorOptions);
    Array.from(state.filters.vendedor).forEach(v=>{ if(!allowed.has(v)) state.filters.vendedor.delete(v); });
  }
  buildFilterField(bar, "vendedor", "Vendedor", vendedorOptions);
  buildFilterField(bar, "status", "Status", STATUS_FILTER_OPTIONS, (v)=> ({inativam:"var(--warn)",inativo:"var(--ink-faint)",proposta:"#7a5cd6",negociando:"#c98a1f",ganho:"var(--good)",perdido:"var(--bad)",[STATUS_VIRTUAL_TODOS_MES]:"var(--accent)"}[v]));
  const segOptions = uniqSorted(SEGMENTO_OPTIONS.concat(state.leads.map(l=>l.seg)));
  buildFilterField(bar, "seg", "Segmento", segOptions);
  const ufOptions = uniqSorted(UF_OPTIONS.concat(state.leads.map(l=>l.uf)));
  buildFilterField(bar, "uf", "UF", ufOptions);
  buildFilterField(bar, "ofensor", "Ofensor", OFENSOR_OPTIONS);

  // Marcadores de filtro: salvar/reaplicar combinações de filtro salvas
  // para o e-mail de acesso atual.
  const presetsField = document.createElement("div");
  presetsField.className = "field";
  const presetCount = (state.filterPresets||[]).length;
  presetsField.innerHTML = `<label><span>Marcadores</span></label>
    <button type="button" class="select-btn ${presetCount?'has-value':''}" data-filterkey="__presets" id="btnFilterPresets">
      <span>⭐ ${presetCount ? presetCount+" salvo(s)" : "Salvar filtro"}</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
    </button>`;
  bar.appendChild(presetsField);
  presetsField.querySelector(".select-btn").addEventListener("click", (e)=>{
    openFilterPresetsPopover(e.currentTarget);
  });

  if(state.bulkSelected && state.bulkSelected.size){
    const bulkPill = document.createElement("button");
    bulkPill.className = "filter-clear";
    bulkPill.textContent = `🔎 Mostrando ${state.bulkSelected.size} selecionado(s) em massa — ✕ limpar`;
    bulkPill.addEventListener("click", ()=>{
      state.bulkSelected = new Set();
      renderAll();
    });
    bar.appendChild(bulkPill);
  }

  const anyActive = Object.values(state.filters).some(s=>s.size);
  if(anyActive || state.shortcut || (state.bulkSelected && state.bulkSelected.size)){
    const clearBtn = document.createElement("button");
    clearBtn.className = "filter-clear"; clearBtn.textContent = "✕ Limpar filtros";
    clearBtn.addEventListener("click", ()=>{
      Object.values(state.filters).forEach(s=>s.clear());
      state.shortcut = null;
      state.bulkSelected = new Set();
      renderAll();
    });
    bar.appendChild(clearBtn);
  }
}

// The "Mês (base)" selector always offers every month of the tracked window
// (Setembro/2026 through Dezembro/2027), whether or not that month has data
// yet imported — so the whole planning horizon is visible from day one,
// instead of only appearing once a file for that month has been imported.
function buildAllMonthOptions(){
  const out = [];
  let [y,m] = TRACKING_START.split("-").map(Number);
  const [endY,endM] = [2027,12];
  while(y<endY || (y===endY && m<=endM)){
    out.push(y+"-"+String(m).padStart(2,"0"));
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
const ALL_MONTH_OPTIONS = buildAllMonthOptions();
function getAllMonthOptions(){
  const set = new Set(ALL_MONTH_OPTIONS);
  // still fold in anything already imported/selected outside that window, just in case
  state.months.forEach(m=>{ if(m.monthKey>=TRACKING_START) set.add(m.monthKey); });
  if(state.monthKey>=TRACKING_START) set.add(state.monthKey);
  return Array.from(set).sort();
}

/* ============================= RENDER: DASHBOARD ============================= */
function pct(n,d){ return d? Math.round(n/d*100) : 0; }

function heatColor(t){
  t = Math.max(0, Math.min(1, t));
  const stops = [[59,127,217],[224,138,31],[192,57,43]]; // azul -> laranja -> vermelho
  const seg = t<0.5 ? 0 : 1;
  const lt = t<0.5 ? t/0.5 : (t-0.5)/0.5;
  const c0=stops[seg], c1=stops[seg+1];
  const r=Math.round(c0[0]+(c1[0]-c0[0])*lt), g=Math.round(c0[1]+(c1[1]-c0[1])*lt), b=Math.round(c0[2]+(c1[2]-c0[2])*lt);
  return `rgb(${r},${g},${b})`;
}

function donutHtml(segments, opts){
  opts = opts || {};
  const total = segments.reduce((s,x)=>s+x.count,0);
  let acc = 0;
  const parts = segments.map(seg=>{
    const start = total? acc/total*360 : 0;
    acc += seg.count;
    const end = total? acc/total*360 : 0;
    return `${seg.color} ${start}deg ${end}deg`;
  });
  const bg = total ? parts.join(", ") : "var(--surface-3) 0deg 360deg";
  const legend = segments.map(seg=>`
    <div class="donut-legend-row"${seg.drillKey?` data-drill="${escapeHtml(seg.drillKey)}" style="cursor:pointer;"`:""}>
      <i style="background:${seg.color}"></i>
      <span class="dl-label" title="${escapeHtml(seg.label)}">${escapeHtml(seg.label)}</span>
      <span class="dl-val">${seg.count}</span>
      <span class="dl-pct">${pct(seg.count,total)}%</span>
    </div>`).join("");
  return `
    <div class="donut-row">
      <div class="donut${opts.pie?" pie":""}" style="background:conic-gradient(${bg});"></div>
      <div class="donut-legend">${legend}</div>
    </div>`;
}

function thermometerHtml(segments){
  const total = segments.reduce((s,x)=>s+x.count,0);
  const dominant = segments.slice().sort((a,b)=>b.count-a.count)[0] || {label:"—", count:0, color:"var(--ink-faint)"};
  const fillRatio = total ? dominant.count/total : 0;
  const descMap = {
    Frio:"Baixa intenção de compra.",
    Morno:"Já interage e pesquisa, mas precisa ser nutrido.",
    Quente:"Intenção clara de compra, próximo de fechar."
  };
  const legend = segments.map(seg=>`
    <div class="donut-legend-row"${seg.drillKey?` data-drill="${escapeHtml(seg.drillKey)}" style="cursor:pointer;"`:""}>
      <i style="background:${seg.color}"></i>
      <span class="dl-label">${escapeHtml(seg.label)}</span>
      <span class="dl-val">${seg.count}</span>
      <span class="dl-pct">${pct(seg.count,total)}%</span>
    </div>`).join("");

  // Desenhado inteiramente em SVG (em vez de divs empilhadas em flex) para que o
  // tubo, o preenchimento e o bulbo fiquem sempre alinhados entre si, não importa
  // a largura do card — evita o "quebra de layout" que acontecia com flex-wrap.
  const tubeTop=8, tubeBottom=148, tubeH=tubeBottom-tubeTop, tubeX=34, tubeW=22, cx=tubeX+tubeW/2;
  const fillH = Math.max(6, Math.round(tubeH*fillRatio));
  const fillY = tubeBottom - fillH;
  const marks = [100,75,50,25,0];
  const scaleSvg = marks.map((m,i)=>{
    const y = tubeTop + (tubeH/(marks.length-1))*i;
    return `<line x1="${tubeX-10}" y1="${y}" x2="${tubeX-4}" y2="${y}" stroke="var(--border)"></line>
      <text x="${tubeX-14}" y="${y+3}" font-size="9" text-anchor="end" fill="var(--ink-faint)">${m}</text>`;
  }).join("");
  const thermSvg = `
    <svg viewBox="0 0 92 186" style="width:88px; height:180px; flex:none;">
      ${scaleSvg}
      <rect x="${tubeX}" y="${tubeTop}" width="${tubeW}" height="${tubeH}" rx="11" fill="var(--surface-3)" stroke="var(--border-soft)"></rect>
      <rect x="${tubeX}" y="${fillY}" width="${tubeW}" height="${fillH}" rx="11" fill="${dominant.color}"></rect>
      <circle cx="${cx}" cy="${tubeBottom}" r="22" fill="var(--surface)"></circle>
      <circle cx="${cx}" cy="${tubeBottom}" r="17" fill="${dominant.color}"></circle>
    </svg>`;

  return `
    <div class="therm-row">
      ${thermSvg}
      <div class="therm-info">
        <div class="therm-dominant"><b>${escapeHtml(dominant.label.toUpperCase())}</b></div>
        <div class="therm-desc">${escapeHtml(descMap[dominant.label]||"")}</div>
        <div class="therm-total">${dominant.count} leads</div>
        <div class="donut-legend" style="margin-top:10px;">${legend}</div>
      </div>
    </div>`;
}

function hbarListHtml(rows, opts){
  opts = opts || {};
  if(!rows.length) return `<div class="k-sub">Sem dados no período.</div>`;
  const total = opts.total != null ? opts.total : rows.reduce((s,r)=>s+r.count,0);
  const max = Math.max(...rows.map(r=>r.count), 1);
  return `<div class="hbar-list">` + rows.map(r=>`
    <div class="hbar-row"${r.drillKey?` data-drill="${escapeHtml(r.drillKey)}" style="cursor:pointer;"`:""}>
      <span class="hb-label" title="${escapeHtml(r.label)}">${escapeHtml(r.label)}</span>
      <span class="hbar-track"><span class="hbar-fill" style="width:${Math.round(r.count/max*100)}%;"></span></span>
      <span class="hb-val">${r.count}${total? ` (${pct(r.count,total)}%)`:""}</span>
    </div>`).join("") + `</div>`;
}

async function renderDashboard(){
  const wrap = document.getElementById("viewDashboard");
  wrap.innerHTML = `<div class="panel" style="padding:40px; text-align:center; color:var(--ink-faint);"><span class="spinner"></span> Carregando dashboard...</div>`;
  const list = currentFiltered();
  const total = list.length;

  const filterParts = activeFilterSummary();
  const filterNote = filterParts.length
    ? `<div style="font-size:11px; color:var(--accent); font-weight:600;">Filtros aplicados: ${filterParts.map(escapeHtml).join(" · ")}</div>`
    : "";

  /* ---- KPI row: contagem por estágio + ofensores + temperatura ---- */
  const stageCounts = {};
  STAGES.forEach(s=>{ stageCounts[s.key] = list.filter(l=>l.stage===s.key).length; });
  const tempCounts = {quente:0, morno:0, frio:0};
  list.forEach(l=>{ const t = temperature(l); if(t) tempCounts[t]++; });
  const ofensorCounts = {};
  list.forEach(l=>{ if(l.ofensor) ofensorCounts[l.ofensor] = (ofensorCounts[l.ofensor]||0)+1; });
  let ofensorRows = Object.entries(ofensorCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k, count:v}));
  // Quando nenhum ofensor ainda foi citado no período, lista as opções disponíveis
  // (com 0) em vez de mostrar o painel vazio — assim dá pra ver o que existe.
  const ofensorNoneCited = !ofensorRows.length;
  if(ofensorNoneCited) ofensorRows = OFENSOR_OPTIONS.map(o=>({label:o, count:0}));
  ofensorRows = ofensorRows.map((r,i)=>({...r, drillKey:`ofensor-${i}`}));
  const ofensorTotal = ofensorRows.reduce((s,r)=>s+r.count,0);

  function kpiTile(label, value, sub){
    return `<div class="kpi"><div class="k-label">${escapeHtml(label)}</div><div class="k-value num">${value}</div><div class="k-sub">${sub}</div></div>`;
  }

  /* ---- Atualização por vendedor: quem mais preencheu informações de CRM
     (resumo de contato, data do último contato, decisor ou WhatsApp) nos leads
     sob sua responsabilidade, dentro do período/filtros atuais. ---- */
  const vendorUpdateMap = {};
  list.forEach(l=>{
    const hasCrmInfo = !!(l.notes || l.dtUltimoContato || l.contatoDecisor || l.whatsapp || l.whatsappIndisponivel);
    const vendedorKey = l.vendedor || "(sem vendedor)";
    if(!vendorUpdateMap[vendedorKey]) vendorUpdateMap[vendedorKey] = {vendedor: vendedorKey, time: l.time || lookupTeam(l.vendedor) || "(sem time)", total: 0, atualizados: 0};
    vendorUpdateMap[vendedorKey].total++;
    if(hasCrmInfo) vendorUpdateMap[vendedorKey].atualizados++;
  });
  const vendorUpdateRows = Object.values(vendorUpdateMap)
    .filter(r=>r.vendedor!=="(sem vendedor)")
    .sort((a,b)=>b.atualizados-a.atualizados || b.total-a.total);
  const topVendor = vendorUpdateRows[0] || null;
  const vendorUpdateSub = topVendor
    ? `${escapeHtml(topVendor.vendedor)} (${escapeHtml(topVendor.time)}) — ${topVendor.atualizados} lead(s) com CRM preenchido`
    : "Nenhuma atualização de CRM registrada no período.";

  /* ---- Impedi de inativar: meta de 70% da base do período (respeitando os
     filtros ativos, ex.: vendedor), convertida em Ganho. A base (impedirTotal)
     é calculada IGNORANDO o filtro de Status — senão, ao filtrar por
     Status = Ganho, a base viraria só os próprios clientes em Ganho e a
     meta apareceria sempre em 100%, o que não faz sentido. ---- */
  const impedirBaseLeads = leadsIgnoringStatusFilter();
  const impedirTotal = impedirBaseLeads.length;
  const impedirMeta = Math.ceil(impedirTotal*0.7);
  const impedirEstamos = impedirBaseLeads.filter(l=>l.stage==="ganho").length;
  const impedirFalta = Math.max(0, impedirMeta-impedirEstamos);
  const impedirMetaPct = 70;
  const impedirEstamosPct = pct(impedirEstamos, impedirTotal);
  const impedirFaltaPct = Math.max(0, impedirMetaPct-impedirEstamosPct);
  const impedirKpiHtml = `
    <div class="kpi" id="kpiImpedirInativar" style="grid-column: span 2;">
      <div class="k-label">Impedi de inativar</div>
      <div class="kpi-bars" style="margin-top:0;">
        <div class="kpi-bar-row"><span class="lbl">Meta (70%)</span><span style="font-weight:700;">${impedirMeta} (${impedirMetaPct}%)</span></div>
        <div class="kpi-bar-row"><span class="lbl">Estamos em</span><span style="font-weight:700; color:var(--good);">${impedirEstamos} (${impedirEstamosPct}%)</span></div>
        <div class="kpi-bar-row"><span class="lbl">Falta p/ meta</span><span style="font-weight:700; color:${impedirFalta>0?'var(--warn)':'var(--good)'};">${impedirFalta} (${impedirFaltaPct}%)</span></div>
      </div>
      <div class="k-sub">Base: ${impedirTotal} cliente(s) que inativariam no mês (considerando os filtros ativos)</div>
    </div>`;

  const stageOrder = ["inativam","inativo","contato","proposta","negociando","ganho","perdido"];
  // "Inativariam no mês" — total de clientes do mês fixado, não importa o
  // estágio/status atual (usa a mesma base de leadsIgnoringStatusFilter()
  // já calculada acima para a meta "Impedi de inativar" — respeita os
  // demais filtros ativos, ex.: Vendedor, mas nunca o filtro de Status).
  const inativariamTile = kpiTile("Inativariam no mês", impedirTotal, "Total de clientes do mês, independente do estágio atual");
  const kpiTilesHtml = inativariamTile + stageOrder.map(key=>{
    const stage = STAGES.find(s=>s.key===key);
    const c = stageCounts[key]||0;
    return kpiTile(stage.label, c, `${pct(c,total)}% dos leads do período`);
  }).join("") + `
    ${impedirKpiHtml}
    <div class="kpi">
      <div class="k-label">Ofensores</div>
      <div class="k-value num">${ofensorTotal}</div>
      ${hbarListHtml(ofensorRows.slice(0,4), {total:ofensorTotal})}
    </div>
    ${kpiTile("Frios", tempCounts.frio, `${pct(tempCounts.frio,total)}% dos leads do período`)}
    ${kpiTile("Mornos", tempCounts.morno, `${pct(tempCounts.morno,total)}% dos leads do período`)}
    ${kpiTile("Quentes", tempCounts.quente, `${pct(tempCounts.quente,total)}% dos leads do período`)}
    <div class="kpi" id="kpiVendorUpdates" style="cursor:pointer;" title="Clique para ver o ranking completo por vendedor">
      <div class="k-label">Atualização por vendedor</div>
      <div class="k-value num">${topVendor ? topVendor.atualizados : 0}</div>
      <div class="k-sub">${vendorUpdateSub}</div>
    </div>
  `;

  /* ---- Leads por status (pizza) ---- */
  const statusDonutMap = [
    ["inativo","Inativado"], ["contato","Contato feito"], ["proposta","Proposta enviada"],
    ["negociando","Negociando"], ["ganho","Ganho"], ["perdido","Negociação Perdida"]
  ];
  const statusSegs = statusDonutMap.map(([key,label])=>{
    const stage = STAGES.find(s=>s.key===key);
    return {label, count: stageCounts[key]||0, color: stage.color, drillKey:`status-${key}`};
  });

  /* ---- Temperatura dos leads ---- */
  const tempSegs = [
    {label:"Frio", count:tempCounts.frio, color:TEMP_COLOR.frio, drillKey:"temp-frio"},
    {label:"Morno", count:tempCounts.morno, color:TEMP_COLOR.morno, drillKey:"temp-morno"},
    {label:"Quente", count:tempCounts.quente, color:TEMP_COLOR.quente, drillKey:"temp-quente"}
  ];

  /* ---- Oportunidades por canal (segmento) — todos os segmentos da base ---- */
  const segCounts = {};
  list.forEach(l=>{ const k = l.seg || "(vazio)"; segCounts[k] = (segCounts[k]||0)+1; });
  const segRows = Object.entries(segCounts).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:k, count:v, drillKey:`canal-${i}`}));

  /* ---- Por time ---- */
  const timeCounts = {};
  list.forEach(l=>{ const k = l.time || "(vazio)"; timeCounts[k] = (timeCounts[k]||0)+1; });
  const timeRows = Object.entries(timeCounts).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:k, count:v, drillKey:`time-${i}`}));

  /* ---- Por linha (+ destaque da linha mais vendida em Ganho) ---- */
  const linhaCounts = {};
  LINHAS_OPTIONS.forEach(l=>{ linhaCounts[l]=0; });
  let semLinha = 0;
  list.forEach(l=>{
    const arr = l.linhasPositivadas||[];
    if(!arr.length){ semLinha++; return; }
    arr.forEach(x=>{ linhaCounts[x] = (linhaCounts[x]||0)+1; });
  });
  const linhaRows = [{label:"(vazio)", count:semLinha}, ...Object.entries(linhaCounts).map(([k,v])=>({label:k, count:v}))]
    .sort((a,b)=> b.count-a.count)
    .map((r,i)=>({...r, drillKey:`linha-${i}`}));
  const ganhoLeads = list.filter(l=>l.stage==="ganho");
  const linhaGanhoCounts = {};
  ganhoLeads.forEach(l=>{ (l.linhasPositivadas||[]).forEach(x=>{ linhaGanhoCounts[x]=(linhaGanhoCounts[x]||0)+1; }); });
  const topLinhaGanho = Object.entries(linhaGanhoCounts).sort((a,b)=>b[1]-a[1])[0];

  /* ---- Oportunidades por UF — mapa de calor ----
   * Sempre reflete o conjunto atualmente filtrado (list = currentFiltered()),
   * e não mais só os clientes em "Inativam no mês" — antes o mapa ignorava
   * qualquer filtro aplicado (ex: Status = Ganho) e sempre recontava só o
   * estágio "inativam", o que fazia o mapa aparecer vazio para qualquer
   * outro filtro selecionado.
   */
  // Coluna fixa: total de clientes que inativariam no mês por UF, respeitando
  // todos os filtros ativos (Vendedor, Time, Segmento, UF, Período, Ofensor,
  // busca, atalho) EXCETO o filtro de Status — mesma base de
  // leadsIgnoringStatusFilter(), usada também na meta "Impedi de inativar" e
  // no card "Inativariam no mês". Isso faz a coluna "fixa" acompanhar filtros
  // como Vendedor (ex: ao filtrar um vendedor com 36 clientes no mês, a
  // coluna fixa mostra a distribuição por UF desses 36), mas permanecer
  // estável quando o usuário alterna o filtro de Status. Coluna "filtro
  // atual": respeita também o Status, exatamente como já existia.
  const ufFixedBase = leadsIgnoringStatusFilter();
  const ufFixedCounts = {};
  ufFixedBase.forEach(l=>{ if(l.uf){ ufFixedCounts[l.uf] = (ufFixedCounts[l.uf]||0)+1; } });
  const ufCounts = {};
  list.forEach(l=>{ if(l.uf){ ufCounts[l.uf] = (ufCounts[l.uf]||0)+1; } });
  const maxUf = Math.max(...Object.values(ufCounts), 1);
  // Ranking (Top 10 e ordem da lista) pela coluna fixa, já que ela é a
  // referência estável — a coluna de filtro só acompanha ao lado.
  const top10Uf = Object.entries(ufFixedCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const top10UfSet = new Set(top10Uf.map(([uf])=>uf));
  const mapPaths = Object.entries(BR_UF_PATHS.states).map(([uf,st])=>{
    const ufUpper = uf.toUpperCase();
    const c = ufCounts[ufUpper] || 0;
    const cFixed = ufFixedCounts[ufUpper] || 0;
    const color = c>0 ? heatColor(c/maxUf) : "var(--surface-3)";
    const isTop = top10UfSet.has(ufUpper);
    return `<path d="${st.d}" fill="${color}" ${isTop?'stroke="var(--ink)" stroke-width="2"':''} data-drill="uf-${ufUpper}" style="cursor:pointer;"><title>${escapeHtml(st.name)} (${ufUpper}): ${cFixed} inativariam no mês (fixo) · ${c} no filtro atual</title></path>`;
  }).join("");
  const totalUf = Object.values(ufCounts).reduce((a,b)=>a+b,0);
  const totalUfFixed = Object.values(ufFixedCounts).reduce((a,b)=>a+b,0);
  const ufExportRows = Object.entries(BR_UF_PATHS.states).map(([uf,st])=>{
    const ufUpper = uf.toUpperCase();
    const c = ufCounts[ufUpper] || 0;
    const cFixed = ufFixedCounts[ufUpper] || 0;
    return {"UF": ufUpper, "Estado": st.name, "Inativariam no mês (fixo)": cFixed, "Clientes no filtro atual": c, "% do total (fixo)": pct(cFixed, totalUfFixed||1), "Top 10": top10UfSet.has(ufUpper) ? "Sim" : "Não"};
  }).sort((a,b)=> b["Inativariam no mês (fixo)"]-a["Inativariam no mês (fixo)"]);
  const ufMapHtml = `
    <div class="panel dash-card uf-panel">
      ${dashCardHeader("Oportunidades por UF — mapa de calor", "uf")}
      <div class="uf-map-wrap">
        <div class="uf-map-svg-col">
          <svg viewBox="${BR_UF_PATHS.viewBox}" style="width:100%; height:auto;">${mapPaths}</svg>
          <div class="heat-legend"><span>Menos</span><span class="bar"></span><span>Mais</span></div>
        </div>
        <div>
          <div class="stat-mini-row" style="margin-bottom:12px;">
            <div class="stat-mini"><div class="sm-label">Inativariam no mês (fixo)</div><div class="sm-value">${totalUfFixed}</div></div>
            <div class="stat-mini"><div class="sm-label">Clientes no filtro atual</div><div class="sm-value">${totalUf}</div></div>
          </div>
          <div class="top-uf-row top-uf-header">
            <span class="rank"></span>
            <span class="uf-swatch" style="background:transparent;"></span>
            <span class="uf-name">UF</span>
            <span class="uf-count-pair"><span title="Inativariam no mês — fixo">Fixo</span><span title="Conforme filtro selecionado">Filtro</span></span>
          </div>
          <div class="top-uf-list">
            ${top10Uf.length ? top10Uf.map(([uf,cFixed],i)=>`
              <div class="top-uf-row" data-drill="uf-${uf}" style="cursor:pointer;">
                <span class="rank">${i+1}º</span>
                <span class="uf-swatch" style="background:${heatColor((ufCounts[uf]||0)/maxUf)}"></span>
                <span class="uf-name">${uf}</span>
                <span class="uf-count-pair"><span>${cFixed}</span><span>${ufCounts[uf]||0}</span></span>
              </div>`).join("") : `<div class="k-sub">Nenhum cliente no período selecionado.</div>`}
          </div>
        </div>
      </div>
    </div>`;

  /* ---- Ofensores (ranking, mais → menos citado) ---- */
  const ofensoresPanel = `
    <div class="panel dash-card">
      ${dashCardHeader("Ofensores", "ofensores")}
      <div class="sub-note">${ofensorNoneCited ? "Nenhum ofensor citado no período ainda — opções disponíveis:" : "Ofensores mais citados no período, do mais para o menos citado."}</div>
      ${hbarListHtml(ofensorRows, {total:ofensorTotal})}
    </div>`;

  /* ---- Atualizações por dia da semana + contatos por ligação ---- */
  const WEEKDAY_LABELS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const weekdayCounts = [0,0,0,0,0,0,0];
  list.forEach(l=>{
    const dtStr = l.lastTouched || l.dtUltimoContato;
    if(!dtStr) return;
    const d = new Date(dtStr);
    if(isNaN(d.getTime())) return;
    weekdayCounts[d.getDay()]++;
  });
  const wOrder = [1,2,3,4,5,6,0];
  const maxWd = Math.max(...weekdayCounts, 1);
  const WW=520,WH=180,WPAD=30;
  const wbw = (WW-WPAD*2)/wOrder.length;
  const weekdaySvg = wOrder.map((di,i)=>{
    const v = weekdayCounts[di];
    const h = (WH-WPAD*2) * (v/maxWd);
    const x = WPAD + i*wbw + wbw*0.15;
    const bw2 = wbw*0.7;
    const y = WH-WPAD-h;
    return `<g class="dash-drill-bar" data-drill="weekday-${di}" style="cursor:pointer;">
      <rect x="${WPAD + i*wbw}" y="${WPAD}" width="${wbw}" height="${WH-WPAD*2}" fill="transparent"></rect>
      <rect x="${x}" y="${y}" width="${bw2}" height="${h}" fill="var(--accent)" rx="3"></rect>
      <text x="${x+bw2/2}" y="${WH-WPAD+14}" font-size="9" text-anchor="middle" fill="var(--ink-faint)">${WEEKDAY_LABELS[di].slice(0,3)}</text>
      <text x="${x+bw2/2}" y="${Math.max(y-4,10)}" font-size="10" text-anchor="middle" fill="var(--ink)" font-weight="700">${v}</text>
    </g>`;
  }).join("");
  const ligacaoCount = list.filter(l=> l.ofensorDetalhe && Array.isArray(l.ofensorDetalhe.meiosTentados) && l.ofensorDetalhe.meiosTentados.includes("Ligação")).length;
  const weekdayExportRows = wOrder.map(di=>({"Dia da semana": WEEKDAY_LABELS[di], "Atualizações": weekdayCounts[di]}));
  const weekdayPanel = `
    <div class="panel dash-card">
      ${dashCardHeader("Atualizações por dia da semana", "weekday")}
      <div class="sub-note">Baseado na última atualização registrada em cada lead.</div>
      <svg viewBox="0 0 ${WW} ${WH}" style="width:100%; height:auto;">
        <line x1="${WPAD}" y1="${WH-WPAD}" x2="${WW-WPAD}" y2="${WH-WPAD}" stroke="var(--border)"></line>
        ${weekdaySvg}
      </svg>
      <div class="stat-mini-row">${statMiniHtml("Contatos por Ligação", ligacaoCount)}</div>
    </div>`;

  /* ---- Evolução das reversões (R$), mês a mês ---- */
  const monthsMeta = await Store.listMonths();
  const sortedMonths = monthsMeta.filter(m=>m.monthKey>=TRACKING_START).sort((a,b)=>a.monthKey.localeCompare(b.monthKey));
  const reversaoRows = [];
  for(const m of sortedMonths){
    const {leads} = await ensureMonthLoaded(m.monthKey);
    const filtered = leads.filter(l=>matchesFilters(l, false));
    const revertedLeads = filtered.filter(l=>["ganho"].includes(l.status));
    const valor = revertedLeads.reduce((s,l)=>s+(Number(l.valorPedido)||0),0);
    reversaoRows.push({mk:m.monthKey, valor, drillLeads:revertedLeads});
  }
  const maxRev = Math.max(...reversaoRows.map(r=>r.valor), 1);
  const RW=560, RH=200, RPAD=36;
  const rbw = (RW-RPAD*2)/Math.max(reversaoRows.length,1);
  const reversaoSvg = reversaoRows.map((r,i)=>{
    const h = (RH-RPAD*2) * (r.valor/maxRev);
    const x = RPAD + i*rbw + rbw*0.15;
    const bw2 = rbw*0.7;
    const y = RH-RPAD-h;
    const prevVal = i>0 ? reversaoRows[i-1].valor : null;
    const color = prevVal==null ? "var(--accent)" : (r.valor>prevVal ? "var(--good)" : (r.valor<prevVal ? "var(--bad)" : "var(--accent)"));
    return `<g class="dash-drill-bar" data-drill="reversao-${r.mk}" style="cursor:pointer;">
      <rect x="${RPAD + i*rbw}" y="${RPAD}" width="${rbw}" height="${RH-RPAD*2}" fill="transparent"></rect>
      <rect x="${x}" y="${y}" width="${bw2}" height="${h}" fill="${color}" rx="3"></rect>
      <text x="${x+bw2/2}" y="${RH-RPAD+16}" font-size="9" text-anchor="middle" fill="var(--ink-faint)">${fmtMonthKey(r.mk)}</text>
    </g>`;
  }).join("");
  let trendHtml = "";
  if(reversaoRows.length>=2){
    const last = reversaoRows[reversaoRows.length-1];
    const prevRow = reversaoRows[reversaoRows.length-2];
    const delta = last.valor - prevRow.valor;
    const deltaPct = prevRow.valor ? Math.round(delta/prevRow.valor*100) : (last.valor?100:0);
    const cls = delta>0?"trend-up":(delta<0?"trend-down":"trend-flat");
    const arrow = delta>0?"▲":(delta<0?"▼":"—");
    trendHtml = `<div class="sub-note"><span class="${cls}">${arrow} ${Math.abs(deltaPct)}%</span> em relação ao mês anterior (${fmtMonthKey(prevRow.mk)} → ${fmtMonthKey(last.mk)}) — ${fmtMoney(prevRow.valor)} → ${fmtMoney(last.valor)}</div>`;
  }
  const reversaoExportRows = reversaoRows.map(r=>({"Mês": fmtMonthKey(r.mk), "Valor revertido (R$)": r.valor}));
  const reversaoPanel = `
    <div class="panel dash-card">
      ${dashCardHeader("Evolução das reversões (R$)", "reversao")}
      <div class="sub-note">Valor em R$ de clientes com desfecho "Ganho" (retidos/impedidos de inativar), mês a mês.</div>
      ${trendHtml}
      <svg viewBox="0 0 ${RW} ${RH}" style="width:100%; height:auto;">
        <line x1="${RPAD}" y1="${RH-RPAD}" x2="${RW-RPAD}" y2="${RH-RPAD}" stroke="var(--border)"></line>
        ${reversaoSvg}
      </svg>
    </div>`;

  const kpiExportRows = stageOrder.map(key=>{
    const stage = STAGES.find(s=>s.key===key);
    const c = stageCounts[key]||0;
    return {"Indicador": stage.label, "Total": c, "%": pct(c,total)};
  }).concat([
    {"Indicador":"Frios", "Total":tempCounts.frio, "%":pct(tempCounts.frio,total)},
    {"Indicador":"Mornos", "Total":tempCounts.morno, "%":pct(tempCounts.morno,total)},
    {"Indicador":"Quentes", "Total":tempCounts.quente, "%":pct(tempCounts.quente,total)},
    {"Indicador":"Impedi de inativar — Meta (70%)", "Total":impedirMeta, "%":impedirMetaPct},
    {"Indicador":"Impedi de inativar — Estamos em", "Total":impedirEstamos, "%":impedirEstamosPct},
    {"Indicador":"Impedi de inativar — Falta para a meta", "Total":impedirFalta, "%":impedirFaltaPct}
  ]).concat(ofensorRows.map(r=>({"Indicador":`Ofensor: ${r.label}`, "Total":r.count, "%":pct(r.count,ofensorTotal)})));

  const statusExportRows = statusSegs.map(s=>({"Status":s.label, "Total":s.count, "%":pct(s.count,total)}));
  const tempExportRows = tempSegs.map(s=>({"Temperatura":s.label, "Total":s.count, "%":pct(s.count,total)}));
  const segExportRows = segRows.map(r=>({"Segmento":r.label, "Total":r.count, "%":pct(r.count,total)}));
  const timeExportRows = timeRows.map(r=>({"Time":r.label, "Total":r.count, "%":pct(r.count,total)}));
  const linhaExportRows = linhaRows.map(r=>({"Linha":r.label, "Total":r.count, "%":pct(r.count,total)}));
  const ofensorExportRows = ofensorRows.map(r=>({"Ofensor":r.label, "Total":r.count, "%":pct(r.count,ofensorTotal)}));

  wrap.innerHTML = `
    <div class="dash-wrap">
      ${filterNote}
      <div class="panel dash-card">
        ${dashCardHeader("Resumo do período", "kpis")}
        <div class="kpis">${kpiTilesHtml}</div>
      </div>
      <div class="dash-grid cols-2">
        <div class="panel dash-card">${dashCardHeader("Leads por status", "status")}${donutHtml(statusSegs, {pie:true})}</div>
        <div class="panel dash-card">${dashCardHeader("Temperatura dos leads", "temperatura")}${thermometerHtml(tempSegs)}</div>
      </div>
      <div class="dash-grid">
        <div class="panel dash-card">${dashCardHeader("Oportunidades por canal", "canal")}<div class="sub-note">Todos os segmentos da base.</div>${hbarListHtml(segRows,{total})}</div>
        <div class="panel dash-card">${dashCardHeader("Por time", "time")}${hbarListHtml(timeRows,{total})}</div>
        <div class="panel dash-card">${dashCardHeader("Por linha", "linha")}${hbarListHtml(linhaRows,{total})}
          ${topLinhaGanho ? `<div class="dash-callout">Linha mais vendida em <b>Ganho</b>: <b>${escapeHtml(topLinhaGanho[0])}</b> (${topLinhaGanho[1]} pedido(s))</div>` : `<div class="dash-callout">Nenhuma linha positivada em leads "Ganho" no período.</div>`}
        </div>
      </div>
      <div class="dash-grid" style="grid-template-columns:1fr;">
        ${ufMapHtml}
      </div>
      <div class="dash-grid cols-2">
        ${ofensoresPanel}
        ${weekdayPanel}
      </div>
      <div class="dash-grid" style="grid-template-columns:1fr;">
        ${reversaoPanel}
      </div>
    </div>
  `;

  // Cada card do dashboard tem um cabeçalho clicável (título + botão "⬇ Excel")
  // que exporta só os dados daquela seção — a mesma lógica de exportação usada
  // no Comparativo & Histórico, aplicada a cada gráfico individualmente.
  const dashExportMap = {
    kpis: {title:"Resumo do período", rows:kpiExportRows, filename:`dashboard_resumo_${state.monthKey}.xlsx`},
    status: {title:"Leads por status", rows:statusExportRows, filename:`dashboard_leads_por_status_${state.monthKey}.xlsx`},
    temperatura: {title:"Temperatura dos leads", rows:tempExportRows, filename:`dashboard_temperatura_${state.monthKey}.xlsx`},
    canal: {title:"Oportunidades por canal", rows:segExportRows, filename:`dashboard_por_canal_${state.monthKey}.xlsx`},
    time: {title:"Por time", rows:timeExportRows, filename:`dashboard_por_time_${state.monthKey}.xlsx`},
    linha: {title:"Por linha", rows:linhaExportRows, filename:`dashboard_por_linha_${state.monthKey}.xlsx`},
    uf: {title:"Oportunidades por UF", rows:ufExportRows, filename:`dashboard_por_uf_${state.monthKey}.xlsx`},
    ofensores: {title:"Ofensores", rows:ofensorExportRows, filename:`dashboard_ofensores_${state.monthKey}.xlsx`},
    weekday: {title:"Atualizações por dia da semana", rows:weekdayExportRows, filename:`dashboard_dia_da_semana_${state.monthKey}.xlsx`},
    reversao: {title:"Evolução das reversões", rows:reversaoExportRows, filename:`dashboard_reversoes_${state.monthKey}.xlsx`}
  };
  wrap.querySelectorAll(".dash-h3-export").forEach(h3=>{
    h3.addEventListener("click", async ()=>{
      const cfg = dashExportMap[h3.dataset.dashExport];
      if(!cfg) return;
      if(!cfg.rows.length){ toast("Não há dados para exportar nesta seção.", "err"); return; }
      await downloadWorkbook([{name:cfg.title.slice(0,31), rows:cfg.rows}], cfg.filename);
    });
  });

  // Drilldown por linha/segmento/barra: cada elemento clicável do dashboard
  // carrega um data-drill; drillMap resolve esse identificador para {title, leads}
  // e abre o popup com a lista de clientes daquele recorte (com export próprio).
  const drillMap = {};
  statusDonutMap.forEach(([key,label])=>{
    drillMap[`status-${key}`] = {title:`Leads por status — ${label}`, leads: list.filter(l=>l.stage===key)};
  });
  drillMap["temp-frio"] = {title:"Temperatura dos leads — Frio", leads: list.filter(l=>temperature(l)==="frio")};
  drillMap["temp-morno"] = {title:"Temperatura dos leads — Morno", leads: list.filter(l=>temperature(l)==="morno")};
  drillMap["temp-quente"] = {title:"Temperatura dos leads — Quente", leads: list.filter(l=>temperature(l)==="quente")};
  segRows.forEach((r,i)=>{
    drillMap[`canal-${i}`] = {title:`Oportunidades por canal — ${r.label}`, leads: list.filter(l=>(l.seg||"(vazio)")===r.label)};
  });
  timeRows.forEach((r,i)=>{
    drillMap[`time-${i}`] = {title:`Por time — ${r.label}`, leads: list.filter(l=>(l.time||"(vazio)")===r.label)};
  });
  linhaRows.forEach((r,i)=>{
    drillMap[`linha-${i}`] = {title:`Por linha — ${r.label}`, leads: list.filter(l=>{
      const arr = l.linhasPositivadas||[];
      return r.label==="(vazio)" ? !arr.length : arr.includes(r.label);
    })};
  });
  ofensorRows.forEach((r,i)=>{
    drillMap[`ofensor-${i}`] = {title:`Ofensores — ${r.label}`, leads: list.filter(l=>l.ofensor===r.label)};
  });
  Object.keys(BR_UF_PATHS.states).forEach(uf=>{
    const ufUpper = uf.toUpperCase();
    drillMap[`uf-${ufUpper}`] = {title:`Oportunidades por UF — ${ufUpper}`, leads: list.filter(l=>l.uf===ufUpper)};
  });
  wOrder.forEach(di=>{
    drillMap[`weekday-${di}`] = {title:`Atualizações — ${WEEKDAY_LABELS[di]}`, leads: list.filter(l=>{
      const dtStr = l.lastTouched || l.dtUltimoContato;
      if(!dtStr) return false;
      const d = new Date(dtStr);
      return !isNaN(d.getTime()) && d.getDay()===di;
    })};
  });
  reversaoRows.forEach(r=>{
    drillMap[`reversao-${r.mk}`] = {title:`Reversões — ${fmtMonthKey(r.mk)}`, leads: r.drillLeads||[]};
  });
  wrap.querySelectorAll("[data-drill]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const cfg = drillMap[el.dataset.drill];
      if(!cfg) return;
      openDrilldownModal(cfg.title, cfg.leads);
    });
  });

  const kpiVendorUpdatesEl = document.getElementById("kpiVendorUpdates");
  if(kpiVendorUpdatesEl){
    kpiVendorUpdatesEl.addEventListener("click", ()=> openVendorUpdatesModal(vendorUpdateRows));
  }
}

/* ============================= AGENDA DE LIGAÇÕES ============================= */
// Visão separada, mas totalmente integrada ao pipeline: não tem base de dados
// própria (diferente do protótipo agendaligacoes.html) — os "compromissos" são
// os próprios leads do pipeline, lidos direto de dtUltimoContato/dtProximoContato,
// e usa os MESMOS filtros globais (filterbar/shortcuts/busca) já aplicados em
// currentFiltered(), então qualquer filtro do Pipeline também filtra a Agenda.
const AGENDA_WEEKDAY_NAMES = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function agendaStatusFor(dateStr, todayStr){
  if(dateStr < todayStr) return "atrasada";
  if(dateStr === todayStr) return "hoje";
  return "futuro";
}
function agendaDayLabel(dateStr){
  const d = parseISODate(dateStr);
  if(!d) return "";
  const label = AGENDA_WEEKDAY_NAMES[d.getDay()]+", "+d.getDate()+" de "+MONTH_NAMES[d.getMonth()];
  return label.charAt(0).toUpperCase()+label.slice(1);
}
function agendaShortDate(dateStr){
  const d = parseISODate(dateStr);
  if(!d) return "—";
  return d.getDate()+" "+MONTH_NAMES[d.getMonth()].slice(0,3);
}

const AGENDA_IDENTITY_KEY = "dellamed_agenda_identities_v1";
function loadAgendaIdentityStore(){
  try{ return JSON.parse(localStorage.getItem(AGENDA_IDENTITY_KEY) || "{}"); }catch(e){ return {}; }
}
function saveAgendaIdentityStore(data){
  try{ localStorage.setItem(AGENDA_IDENTITY_KEY, JSON.stringify(data)); }catch(e){}
}
function normVendedorLoginName(s){ return norm(s).replace(/\s+/g," ").trim(); }
function normLoginEmail(s){ return String(s||"").trim().toLowerCase(); }
// Recupera (do navegador) a identidade ativa, se já houver uma — sem exigir
// que a pessoa preencha o formulário de novo a cada visita.
function ensureAgendaIdentity(){
  if(state.agendaIdentity) return state.agendaIdentity;
  const store = loadAgendaIdentityStore();
  if(store.currentEmail && store.byEmail && store.byEmail[store.currentEmail]){
    const rec = store.byEmail[store.currentEmail];
    state.agendaIdentity = {email: store.currentEmail, displayName: rec.displayName, vendedor: rec.vendedor, isAdmin: ADMIN_EMAILS.has(store.currentEmail)};
  }
  return state.agendaIdentity;
}
// Tenta identificar a pessoa a partir do nome/e-mail digitados no formulário.
// Retorna {ok:true} em caso de sucesso (já deixa state.agendaIdentity pronto
// e salvo no navegador) ou {ok:false, msg} para reexibir o formulário com erro.
function attemptAgendaLogin(typedName, typedEmail){
  const name = String(typedName||"").trim();
  const emailKey = normLoginEmail(typedEmail);
  if(!name || !emailKey){
    return {ok:false, msg:"Preencha nome e e-mail para acessar."};
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailKey)){
    return {ok:false, msg:"Informe um e-mail válido."};
  }
  const isAdmin = ADMIN_EMAILS.has(emailKey);
  const registeredVendedor = VENDOR_LOGIN_REGISTRY[emailKey] || null;
  if(!isAdmin && !registeredVendedor){
    return {ok:false, msg:"Esse e-mail ainda não está cadastrado no acesso da Pipeline. Peça para a administração liberar o seu login."};
  }
  const vendedor = isAdmin ? null : registeredVendedor;
  const store = loadAgendaIdentityStore();
  store.byEmail = store.byEmail || {};
  store.byEmail[emailKey] = {vendedor, displayName: name, savedAt: nowISO()};
  store.currentEmail = emailKey;
  saveAgendaIdentityStore(store);
  state.agendaIdentity = {email: emailKey, displayName: name, vendedor, isAdmin};
  state.agendaLoginError = null;
  return {ok:true};
}
function agendaLogout(){
  state.agendaIdentity = null;
  state.agendaLoginError = null;
  state.agendaLoginPrefill = {name:"", email:""};
  const store = loadAgendaIdentityStore();
  store.currentEmail = null;
  saveAgendaIdentityStore(store);
  renderAll();
}

function renderAgenda(){
  const wrap = document.getElementById("viewAgenda");
  // A identificação (nome+e-mail) já foi conferida no gate do app inteiro
  // antes de qualquer view renderizar — aqui só usamos o resultado dela.
  const identity = ensureAgendaIdentity();
  // Respeita todos os filtros/atalhos/busca do Pipeline, e além disso só
  // mostra os leads do vendedor identificado neste navegador — cada pessoa
  // só vê a própria agenda, nunca a dos colegas. E-mails de acesso total
  // (liderança, ADMIN_EMAILS) não passam por esse filtro e veem tudo.
  const list = identity.isAdmin
    ? currentFiltered()
    : currentFiltered().filter(l=> normVendedorLoginName(l.vendedor||"")===normVendedorLoginName(identity.vendedor));
  const todayStr = isoDateLocal(new Date());

  // Só entram na Agenda os leads com "próximo contato" agendado.
  const scheduled = list.filter(l=>l.dtProximoContato);
  const callsByDay = {};
  scheduled.forEach(l=>{ (callsByDay[l.dtProximoContato] = callsByDay[l.dtProximoContato] || []).push(l); });

  const todaysCalls = callsByDay[todayStr] || [];
  const overdue = scheduled.filter(l=>l.dtProximoContato < todayStr);

  /* ---- Rail: resumo de hoje + próximo contato + lista de próximos ---- */
  // Ordena por data e, dentro do mesmo dia, pelo horário do próximo contato
  // (leads sem horário registrado — base legada — vão para o fim do dia).
  const sortKey = l => l.dtProximoContato+"T"+(l.horaProximoContato||"99:99");
  const sortedUpcoming = scheduled.slice().sort((a,b)=> sortKey(a) < sortKey(b) ? -1 : (sortKey(a) > sortKey(b) ? 1 : 0));
  const nextCall = sortedUpcoming.find(l=>l.dtProximoContato >= todayStr) || null;
  const nextCallHtml = nextCall
    ? `<div class="agd-next-call" data-agd-open="${escapeHtml(nextCall.cod)}">
         <div class="lbl">Próximo contato</div>
         <div class="nm">${escapeHtml(nextCall.cli||"—")}</div>
         <div class="wh">${agendaShortDate(nextCall.dtProximoContato)}${nextCall.horaProximoContato?" às "+escapeHtml(nextCall.horaProximoContato):""}</div>
       </div>`
    : `<div class="agd-empty">Nenhum contato futuro agendado.</div>`;

  const upcomingItems = sortedUpcoming.slice(0, 10);
  const upcomingHtml = upcomingItems.length
    ? upcomingItems.map(l=>{
        const st = agendaStatusFor(l.dtProximoContato, todayStr);
        return `<div class="agd-upcoming-item${st==="atrasada"?" overdue":""}" data-agd-open="${escapeHtml(l.cod)}">
          <div class="dchip">${agendaShortDate(l.dtProximoContato)}${l.horaProximoContato?`<br>${escapeHtml(l.horaProximoContato)}`:""}</div>
          <div class="info">
            <div class="nm">${escapeHtml(l.cli||"—")}</div>
            <div class="mt">${escapeHtml(l.vendedor||l.time||"Sem responsável")}</div>
          </div>
        </div>`;
      }).join("")
    : `<div class="agd-empty">Nada agendado com os filtros atuais.</div>`;

  /* ---- Calendário mensal ---- */
  const firstOfMonth = new Date(state.agendaYear, state.agendaMonth, 1);
  const startWeekday = firstOfMonth.getDay();
  const gridStart = new Date(state.agendaYear, state.agendaMonth, 1-startWeekday);
  let calHtml = "";
  for(let i=0;i<42;i++){
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
    const dStr = isoDateLocal(d);
    const inMonth = d.getMonth()===state.agendaMonth;
    const isToday = dStr===todayStr;
    const isSelected = dStr===state.agendaSelectedDate;
    const dayCalls = (callsByDay[dStr]||[]);
    const cls = ["agd-cal-cell"];
    if(!inMonth) cls.push("other-month");
    if(isToday) cls.push("today");
    if(isSelected) cls.push("selected");
    let chips = "";
    dayCalls.slice(0,3).forEach(l=>{
      chips += `<div class="agd-cal-chip ${agendaStatusFor(dStr, todayStr)}">${escapeHtml(l.cli||"—")}</div>`;
    });
    const more = dayCalls.length>3 ? `<div class="agd-cal-more">+${dayCalls.length-3} mais</div>` : "";
    calHtml += `<div class="${cls.join(" ")}" data-agd-date="${dStr}">
      <div class="agd-daynum">${d.getDate()}</div>
      <div class="agd-cal-chips">${chips}</div>${more}
    </div>`;
  }

  /* ---- Cronograma da semana: o dia de hoje fica sempre fixado/visível;
     o restante da semana pode ser ocultado/exibido pelo botão de alternância. ---- */
  const todaySched = scheduleForWeekday(new Date().getDay());
  const todayScheduleHtml = todaySched ? `
    <div class="agd-week-day is-today agd-week-day-pinned">
      <div class="agd-week-day-head"><span>${todaySched.icon}</span> ${todaySched.label} <span class="agd-week-pinned-tag">hoje · fixado</span></div>
      <ul>${todaySched.itens.map(it=>`<li>${escapeHtml(it)}</li>`).join("")}</ul>
      <div class="agd-week-obj">🎯 ${escapeHtml(todaySched.objetivo)}</div>
    </div>` : `<div class="agd-week-day agd-week-day-pinned"><div class="agd-week-day-head">Fim de semana</div><div class="agd-week-obj">Sem cronograma comercial fixo — bom descanso!</div></div>`;

  const weekPanelHtml = state.showWeekPanel ? `
    <div class="agd-week-panel">
      ${WEEKLY_SCHEDULE.map(d=>`
        <div class="agd-week-day${d.weekday===new Date().getDay()?" is-today":""}">
          <div class="agd-week-day-head"><span>${d.icon}</span> ${d.label}</div>
          <ul>${d.itens.map(it=>`<li>${escapeHtml(it)}</li>`).join("")}</ul>
          <div class="agd-week-obj">🎯 ${escapeHtml(d.objetivo)}</div>
        </div>`).join("")}
      <div class="agd-week-routine">
        ${ROTINA_DIARIA.map(r=>`<span class="chip">${escapeHtml(r)}</span>`).join("")}
      </div>
    </div>` : "";

  wrap.innerHTML = `
    <div class="agd-identity-bar">
      <span>${identity.isAdmin ? `Acesso total · agenda de <b>todos os vendedores</b>` : `Agenda de <b>${escapeHtml(identity.vendedor)}</b>`} · identificado(a) como ${escapeHtml(identity.displayName)} (${escapeHtml(identity.email)})</span>
      <button type="button" id="agdLogoutBtn">Trocar usuário</button>
    </div>
    <div class="agd-week-pinned-row">
      ${todayScheduleHtml}
      <div class="agd-week-toggle">
        <button type="button" class="btn btn-subtle" id="agdWeekToggleBtn">${state.showWeekPanel?"▲ Ocultar semana completa":"▼ Ver semana completa"}</button>
        <button type="button" class="btn btn-subtle" id="agdNotifBtn">${(typeof Notification!=="undefined" && Notification.permission==="granted") ? "🔔 Lembretes ativados" : "🔔 Ativar lembretes de ligação neste computador"}</button>
      </div>
    </div>
    ${weekPanelHtml}
    <div class="agd-layout">
      <aside>
        <div class="panel agd-panel">
          <h3 class="agd-h3">Hoje</h3>
          <div class="agd-today-count mono">${todaysCalls.length}</div>
          <div class="agd-today-cap">${todaysCalls.length===1?"contato agendado":"contatos agendados"}</div>
          ${overdue.length ? `<div class="agd-overdue-flag" data-agd-goto="${overdue[0].dtProximoContato}">⚠ ${overdue.length} contato(s) atrasado(s)</div>` : ""}
          ${nextCallHtml}
        </div>
        <div class="panel agd-panel">
          <h3 class="agd-h3">Próximos contatos</h3>
          <div class="agd-upcoming-list">${upcomingHtml}</div>
        </div>
      </aside>
      <main>
        <div class="panel agd-cal-card">
          <div class="agd-cal-head">
            <div class="agd-nav-btns">
              <button type="button" data-agd-nav="prev" aria-label="Mês anterior">‹</button>
              <button type="button" class="agd-today-btn" data-agd-nav="today">Hoje</button>
              <button type="button" data-agd-nav="next" aria-label="Próximo mês">›</button>
            </div>
            <div class="agd-month-label">${MONTH_NAMES[state.agendaMonth]} de ${state.agendaYear}</div>
          </div>
          <div class="agd-cal-weekdays"><div>dom</div><div>seg</div><div>ter</div><div>qua</div><div>qui</div><div>sex</div><div>sáb</div></div>
          <div class="agd-cal-grid">${calHtml}</div>
        </div>
      </main>
    </div>`;

  function agendaGoto(dateStr){
    const d = parseISODate(dateStr);
    if(!d) return;
    state.agendaYear = d.getFullYear();
    state.agendaMonth = d.getMonth();
    state.agendaSelectedDate = dateStr;
    renderAgenda();
  }

  wrap.querySelectorAll("[data-agd-goto]").forEach(el=>{
    el.addEventListener("click", ()=> agendaGoto(el.dataset.agdGoto));
  });
  wrap.querySelectorAll("[data-agd-date]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.agendaSelectedDate = el.dataset.agdDate;
      renderAgenda();
    });
  });
  wrap.querySelectorAll("[data-agd-open]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      openContactPopup(el.dataset.agdOpen);
    });
  });
  const logoutBtn = wrap.querySelector("#agdLogoutBtn");
  if(logoutBtn) logoutBtn.addEventListener("click", agendaLogout);
  const weekToggleBtn = wrap.querySelector("#agdWeekToggleBtn");
  if(weekToggleBtn) weekToggleBtn.addEventListener("click", ()=>{
    state.showWeekPanel = !state.showWeekPanel;
    renderAgenda();
  });
  const notifBtn = wrap.querySelector("#agdNotifBtn");
  if(notifBtn) notifBtn.addEventListener("click", requestNotificationPermission);
  const navPrev = wrap.querySelector('[data-agd-nav="prev"]');
  const navNext = wrap.querySelector('[data-agd-nav="next"]');
  const navToday = wrap.querySelector('[data-agd-nav="today"]');
  if(navPrev) navPrev.addEventListener("click", ()=>{
    state.agendaMonth--; if(state.agendaMonth<0){ state.agendaMonth=11; state.agendaYear--; }
    renderAgenda();
  });
  if(navNext) navNext.addEventListener("click", ()=>{
    state.agendaMonth++; if(state.agendaMonth>11){ state.agendaMonth=0; state.agendaYear++; }
    renderAgenda();
  });
  if(navToday) navToday.addEventListener("click", ()=>{
    const t = new Date();
    state.agendaYear = t.getFullYear(); state.agendaMonth = t.getMonth(); state.agendaSelectedDate = isoDateLocal(t);
    renderAgenda();
  });
}

      <div class="col-body" data-stage="${stage.key}"></div>
      <div class="col-sum">Valor de pedido: ${fmtMoney(totalVal)}</div>
    `;
    col.querySelector(".col-search-btn").addEventListener("click", (e)=>{
      e.stopPropagation();
      openBulkSearchPopover(e.currentTarget, stage.key);
    });
    const body = col.querySelector(".col-body");
    if(!items.length){
      body.innerHTML = `<div class="empty-col">Nenhum lead</div>`;
    }else{
      items.sort((a,b)=>{
        const da = daysUntil(a.dtInat); const db = daysUntil(b.dtInat);
        return (da==null?9999:da) - (db==null?9999:db);
      });
      items.forEach(l=> body.appendChild(renderCard(l)));
    }
    attachDnD(body, col);
    board.appendChild(col);
  });
}

function renderCard(l){
  const card = document.createElement("div");
  card.className = "card" + ((state.bulkSelected && state.bulkSelected.has(l.cod)) ? " bulk-selected" : "");
  card.draggable = true;
  card.dataset.cod = l.cod;
  const temp = temperature(l);
  const d = daysUntil(l.dtInat);
  let daysLabel = "—";
  if(d!=null){
    if(d<0) daysLabel = `<span class="card-days overdue">${l.stage==="inativo"?`Inativado há ${Math.abs(d)}d`:`Inativou há ${Math.abs(d)}d`}</span>`;
    else if(d===0) daysLabel = `<span class="card-days overdue">Inativa hoje</span>`;
    else daysLabel = `<span class="card-days">Inativa em ${d}d</span>`;
  }
  card.innerHTML = `
    <div class="card-top">
      <div class="card-name">${escapeHtml(l.cli||"—")}</div>
      ${temp ? `<span class="temp-dot" title="${TEMP_LABEL[temp]}" style="background:${TEMP_COLOR[temp]}"></span>` : ""}
    </div>
    <div class="card-meta">
      <span class="chip">${escapeHtml(l.cod)}</span>
      <span class="chip">${escapeHtml(l.uf||"—")}</span>
      <span class="chip status-${l.status}">${STATUS_LABEL[l.status]}</span>
    </div>
    <div class="card-meta">
      <span>${fmtMoney(l.valorPedido)}</span>
      ${daysLabel}
    </div>
    <div class="card-foot">
      <span>${escapeHtml(l.vendedor || l.time || "Sem responsável")}</span>
      ${isStale(l) ? '<span class="stale">Sem atualização 7d+</span>' : `<span>${fmtDate(l.dtInat)}</span>`}
    </div>
  `;
  card.addEventListener("click", ()=> openLeadModal(l.cod));
  card.addEventListener("dragstart", (e)=>{
    card.classList.add("dragging");
    e.dataTransfer.setData("text/plain", l.cod);
    e.dataTransfer.effectAllowed = "move";
  });
  card.addEventListener("dragend", ()=> card.classList.remove("dragging"));
  return card;
}

function attachDnD(body, col){
  body.addEventListener("dragover", (e)=>{ e.preventDefault(); col.classList.add("drop-hover"); });
  body.addEventListener("dragleave", ()=> col.classList.remove("drop-hover"));
  body.addEventListener("drop", (e)=>{
    e.preventDefault();
    col.classList.remove("drop-hover");
    const cod = e.dataTransfer.getData("text/plain");
    const newStage = col.dataset.stage;
    const lead = state.leads.find(l=>l.cod===cod);
    requestStageChange(lead, newStage);
  });
}

/* ============================= PERSIST SINGLE LEAD ============================= */
async function persistLead(lead){
  try{
    const meta = state.meta;
    if(!meta) return;
    const ci = meta.codToChunk[lead.cod];
    if(ci==null) return;
    const chunk = await Store.getChunk(state.monthKey, ci);
    const idx = (chunk.leads||[]).findIndex(x=>x.cod===lead.cod);
    if(idx>=0) chunk.leads[idx] = lead; else chunk.leads.push(lead);
    await Store.setChunk(state.monthKey, ci, chunk);
  }catch(err){
    console.error(err);
    toast("Não foi possível salvar a alteração agora. Tente novamente.", "err");
  }
}

function ofensorDetailFieldsHtml(ofensorValue, detail, prefix){

          <input class="form-input" id="${prefix}_itemPerdido" value="${escapeHtml(detail.itemPerdido||"")}" placeholder="Ex: linha Ortho, kit tal...">
        </div>
        <div class="field"><label>Preço oferecido pela concorrência (R$)</label>
          <input class="form-input" type="number" step="0.01" id="${prefix}_precoConcorrencia" value="${detail.precoConcorrencia||""}">
        </div>
        <div class="field"><label>Comprovação (print/áudio do cliente ou orçamento da concorrência) *</label>
          <input class="form-input" type="file" accept="image/*,.pdf" id="${prefix}_comprovacao">
          <div style="font-size:10.5px; color:var(--ink-faint); margin-top:3px;">${detail.comprovacaoId ? "Já existe um anexo salvo — escolha outro arquivo só se quiser substituí-lo." : "Obrigatório. Máx. ~150 KB (foto/print)."}</div>
        </div>
      </div>`;
  }
  if(kind==="giro"){
    return `
      <div class="section-title">Detalhe do ofensor — Giro</div>
      <div class="field"><label>Quais linhas o cliente compra? *</label>
        <div class="stage-row">${LINHAS_OPTIONS.map(o=>`<label class="stage-pill" style="cursor:pointer;"><input type="checkbox" class="visually-hidden ${prefix}_linhasCompradas" value="${o}" ${((detail.linhasCompradas||[]).includes(o))?"checked":""}> ${o}</label>`).join("")}</div>
      </div>`;
  }
  if(kind==="estoque"){
    return `
      <div class="section-title">Detalhe do ofensor — Estoque</div>
      <div class="grid2">
        <div class="field"><label>Item que fez perder o pedido</label>
          <input class="form-input" id="${prefix}_itemFaltante" value="${escapeHtml(detail.itemFaltante||"")}">
        </div>
        <div class="field"><label>Quantidade que o cliente compraria</label>
          <input class="form-input" type="number" id="${prefix}_quantidadeDesejada" value="${detail.quantidadeDesejada||""}">
        </div>
      </div>`;
  }
  if(kind==="meios"){
    return `
      <div class="section-title">Detalhe do ofensor — ${escapeHtml(ofensorValue)}</div>
      <div class="field"><label>Quais meios de contato foram tentados? *</label>
        <div class="stage-row">${MEIOS_CONTATO_OPTIONS.map(o=>`<label class="stage-pill" style="cursor:pointer;"><input type="checkbox" class="visually-hidden ${prefix}_meiosTentados" value="${o}" ${((detail.meiosTentados||[]).includes(o))?"checked":""}> ${o}</label>`).join("")}</div>
      </div>`;
  }
  return "";
}
function wireOfensorPills(root, prefix){
  root.querySelectorAll(`.${prefix}_linhasCompradas, .${prefix}_meiosTentados`).forEach(cb=>{
    cb.addEventListener("change", ()=>{ cb.closest(".stage-pill").classList.toggle("on", cb.checked); });
    if(cb.checked) cb.closest(".stage-pill").classList.add("on");
  });
}
async function collectOfensorDetail(root, ofensorValue, prevDetail, prefix){
  const kind = OFENSOR_DETAIL_KIND[ofensorValue];
  if(!kind) return {ok:true, detail:null};
  const detail = {tipo:ofensorValue};
  if(kind==="preco"){
    detail.itemPerdido = (root.querySelector(`#${prefix}_itemPerdido`)||{}).value || "";
    detail.precoConcorrencia = Number((root.querySelector(`#${prefix}_precoConcorrencia`)||{}).value || 0) || null;
    const fileInput = root.querySelector(`#${prefix}_comprovacao`);
    detail.comprovacaoId = (prevDetail&&prevDetail.comprovacaoId) || null;
    if(fileInput && fileInput.files && fileInput.files[0]){
      const file = fileInput.files[0];
      if(file.size > 200*1024){
        return {ok:false, msg:"O arquivo de comprovação precisa ter até ~150-200 KB. Envie um print/foto mais leve."};
      }
      const dataUrl = await new Promise((resolve,reject)=>{
        const r = new FileReader();
        r.onload = ()=>resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      const id = uid()+"_"+Date.now();
      await Store.setAttachment(id, {dataUrl, name:file.name, type:file.type, size:file.size, uploadedAt: nowISO()});
      detail.comprovacaoId = id;
    }
    if(!detail.comprovacaoId){
      return {ok:false, msg:"Anexe a comprovação (print do cliente falando de preço, ou orçamento/card da concorrência) antes de salvar."};
    }
  }else if(kind==="giro"){
    detail.linhasCompradas = Array.from(root.querySelectorAll(`.${prefix}_linhasCompradas:checked`)).map(el=>el.value);
    if(!detail.linhasCompradas.length) return {ok:false, msg:"Marque ao menos uma linha que o cliente compra."};
  }else if(kind==="estoque"){
    detail.itemFaltante = (root.querySelector(`#${prefix}_itemFaltante`)||{}).value || "";
    detail.quantidadeDesejada = Number((root.querySelector(`#${prefix}_quantidadeDesejada`)||{}).value || 0) || null;
    if(!detail.itemFaltante) return {ok:false, msg:"Informe o item que fez perder o pedido."};
  }else if(kind==="meios"){
    detail.meiosTentados = Array.from(root.querySelectorAll(`.${prefix}_meiosTentados:checked`)).map(el=>el.value);
    if(!detail.meiosTentados.length) return {ok:false, msg:"Marque ao menos um meio de contato tentado."};
  }
  return {ok:true, detail};
}

/* ============================= STAGE CHANGE (guarded) ============================= */
function requestStageChange(lead, newStage){
  if(!lead || lead.stage===newStage) return;
  if(lead.stage==="inativo" && newStage==="inativam"){
    toast('Não é possível voltar um cliente de "Inativado" para "Inativam no mês".', "err");
    return;
  }
  openStageChangeModal(lead, newStage);
}

    closeModal();
    renderAll();

    openLeadModal(lead.cod);
  };
}

const HEADER_ALIASES = {
  "cliente":"cli", "cod cliente":"cod","codigo cliente":"cod", "cod grupo":"codGrupo",
  "grupo de cliente":"grp","telefone":"tel","email":"email","uf":"uf","cidade":"cid","segmento":"seg",
  "tem carteira":"temCarteira","total pedidos pendentes":"pedPend","inadimplente":"inad","valor vencido":"valVenc",
  "data cadastro":"dtCad","data 1 faturamento":"dt1Fat","data ultimo faturamento":"dtUltFat","data inativacao":"dtInat",
  "status atual":"statusErp","data ultimo pedido aberto":"dtUltPedAberto",
  "valor de pedido":"valorPedidoExplicit","valor do pedido":"valorPedidoExplicit","valor pedido":"valorPedidoExplicit","vlr pedido":"valorPedidoExplicit","vlr de pedido":"valorPedidoExplicit",
  "representante (z1)":"rep","vendedor interno (ve)":"vendInt","key account (z3)":"keyAcc","prospect (z5)":"prospect",
  "sucesso do cliente (z6)":"sucCli","cnpj":"cnpj","razao social":"cli"
};
// Fallback keyword rules, tried when a header doesn't match HEADER_ALIASES
// exactly (e.g. slightly different spacing/punctuation around "(Z1)" etc. in
// a real ERP export). Order matters: first matching rule wins. This keeps
// Vendedor/Time derivation working even if a future export's header text
// drifts a little from the original file we built HEADER_ALIASES from.
const HEADER_KEYWORD_RULES = [
  ["representante","rep"],
  ["vendedor interno","vendInt"],
  ["key account","keyAcc"],
  ["prospect","prospect"],
  ["sucesso do cliente","sucCli"],
  ["razao social","cli"],
  ["cnpj","cnpj"],
  ["cod cliente","cod"],["codigo cliente","cod"],
  ["data inativ","dtInat"],
  ["data ultimo faturamento","dtUltFat"],
  ["status atual","statusErp"],
  // "Valor de Pedido" — cobre variações como "Valor Pedido", "Valor do
  // Pedido", "Vlr Pedido" etc. que a base ERP possa usar. NÃO deve ser
  // confundido com "Total Pedidos Pendentes" (pedPend), que é outro campo.
  ["valor de pedido","valorPedidoExplicit"],["valor do pedido","valorPedidoExplicit"],
  ["valor pedido","valorPedidoExplicit"],["vlr pedido","valorPedidoExplicit"]
];
function aliasHeader(h){
  const n = norm(h).replace(/[º°]/g,"").replace(/\s+/g," ").trim();
  if(HEADER_ALIASES[n]) return HEADER_ALIASES[n];
  for(const [kw, key] of HEADER_KEYWORD_RULES){
    if(n.includes(kw)) return key;
  }
  return null;
}
function excelDateToISO(v){
  if(v==null || v==="" || v==="-") return null;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v === "number"){
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[0].slice(0,10);
  return null;
}
function cleanTxt(v){
  if(v==null) return null;
  const s = String(v).trim();
  return (s==="" || s==="-") ? null : s;
}
// Corrige um bug real: quando o Excel já entrega um NÚMERO de verdade para a
// célula (a maioria dos exports numéricos), tratá-lo como texto no formato
// BR (milhar com ponto, decimal com vírgula) e tirar todos os pontos
// corrompia o valor — ex: 1105.84 virava "110584" (o ponto decimal também
// era removido), inflando o faturamento em 100x. Agora só aplicamos a
// conversão de formato BR quando o valor realmente chega como texto; um
// número que o Excel já entregou pronto é usado como está.
function cleanNum(v){
  if(v==null || v==="") return 0;
  if(typeof v === "number") return isFinite(v) ? v : 0;
  const s = String(v).trim();
  if(!s) return 0;
  // Só há formato BR (milhar "." + decimal ",") para desfazer quando existe
  // vírgula no texto; sem vírgula, tratamos o ponto como decimal normal
  // (ou o texto já é um número puro), em vez de arriscar removê-lo.
  const normalized = s.includes(",") ? s.replace(/\./g,"").replace(",", ".") : s;
  const n = Number(normalized);
  return isNaN(n) ? 0 : n;
}

function parseWorkbook(buffer){
  const wb = XLSX.read(buffer, {type:"array", cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  if(!rows.length) return [];
  const headerRow = rows[0];
  const colMap = headerRow.map(aliasHeader);
  // A planilha atual não tem uma coluna própria com cabeçalho "Valor de
  // Pedido" — em vez disso, traz uma coluna SEM cabeçalho (texto vazio)
  // logo antes da segunda coluna "STATUS ATUAL" (a que alimenta o Status
  // ERP/statusErp), contendo o valor do pedido que recuperou o cliente
  // (puxado por VLOOKUP da aba de pedidos, ex: "C pedido 23.09"). Detectamos
  // essa coluna pela posição — em branco, imediatamente antes da coluna que
  // vira statusErp — em vez do nome, já que ela não tem cabeçalho nenhum.
  for(let i=0;i<headerRow.length-1;i++){
    const h = headerRow[i];
    const isBlank = h==null || String(h).trim()==="";
    if(isBlank && !colMap[i] && colMap[i+1]==="statusErp"){
      colMap[i] = "valorPedidoAuto";
    }
  }
  const hasValorPedidoAutoCol = colMap.includes("valorPedidoAuto");
  const out = [];
  for(let i=1;i<rows.length;i++){
    const row = rows[i];
    if(!row || row.every(c=>c==null||c==="")) continue;
    const rec = {};
    colMap.forEach((key,idx)=>{ if(key) rec[key] = row[idx]; });
    if(!rec.cod) continue;
    const dtInat = excelDateToISO(rec.dtInat);
    const dtUltFat = excelDateToISO(rec.dtUltFat);
    // Prioridade do Valor de Pedido: (1) coluna explícita "Valor de Pedido"
    // se a planilha um dia trouxer uma com esse nome; (2) a coluna sem
    // cabeçalho detectada por posição (ver acima), que é o formato atual;
    // (3) na ausência de ambas (planilhas antigas), cai para o Total
    // Pedidos Pendentes (pedPend) como última alternativa.
    let valorPedido;
    if(rec.valorPedidoExplicit!=null && rec.valorPedidoExplicit!==""){
      valorPedido = cleanNum(rec.valorPedidoExplicit);
    }else if(hasValorPedidoAutoCol){
      valorPedido = cleanNum(rec.valorPedidoAuto);
    }else{
      valorPedido = cleanNum(rec.pedPend);
    }
    out.push({
      cod: cleanTxt(rec.cod), cli: cleanTxt(rec.cli), cnpj: cleanTxt(rec.cnpj),
      uf: cleanTxt(rec.uf), cid: cleanTxt(rec.cid), seg: cleanTxt(rec.seg),
      tel: cleanTxt(rec.tel), email: cleanTxt(rec.email),
      temCarteira: cleanTxt(rec.temCarteira), pedPend: cleanNum(rec.pedPend),
      inad: cleanTxt(rec.inad), valVenc: cleanNum(rec.valVenc),
      dtCad: excelDateToISO(rec.dtCad), dt1Fat: excelDateToISO(rec.dt1Fat),
      dtUltFat, dtInat, statusErp: cleanTxt(rec.statusErp),
      valorPedido,
      dtUltPedAberto: excelDateToISO(rec.dtUltPedAberto),
      rep: cleanTxt(rec.rep), vendInt: cleanTxt(rec.vendInt), keyAcc: cleanTxt(rec.keyAcc),
      prospect: cleanTxt(rec.prospect), sucCli: cleanTxt(rec.sucCli)
    });
  }
  return out.filter(r=>r.dtInat); // only rows with a usable inactivation date can be tracked
}

async function ensureMonthLoaded(monthKey){
  if(state._monthCache && state._monthCache[monthKey]) return state._monthCache[monthKey];
  const {meta, leads} = await Store.loadMonthLeads(monthKey);
  state._monthCache = state._monthCache || {};
  state._monthCache[monthKey] = {meta, leads};
  return state._monthCache[monthKey];
}

async function handleFile(file){
  const statusEl = document.getElementById("impStatus");
  statusEl.innerHTML = '<span class="spinner"></span> Lendo planilha...';
  try{
    const buf = await file.arrayBuffer();
    const rows = parseWorkbook(buf);
    if(!rows.length){ statusEl.textContent = "Não encontrei linhas válidas (verifique as colunas Cód Cliente e Data Inativação)."; return; }
    const byMonth = {};
    rows.forEach(r=>{ (byMonth[r.dtInat.slice(0,7)] = byMonth[r.dtInat.slice(0,7)]||[]).push(r); });

    statusEl.innerHTML = '<span class="spinner"></span> Comparando com a base atual...';
    const summary = [];
    for(const mk of Object.keys(byMonth).sort()){
      const {meta} = await ensureMonthLoaded(mk);
      const existingCods = meta ? new Set(Object.keys(meta.codToChunk||{})) : new Set();
      const incoming = byMonth[mk];
      const novos = incoming.filter(r=>!existingCods.has(r.cod)).length;
      const atualizados = incoming.length - novos;
      summary.push({mk, novos, atualizados, total: incoming.length});
    }
    renderImportSummary(file, byMonth, summary);
  }catch(err){
    console.error(err);
    statusEl.textContent = "Não consegui ler esse arquivo. Confirme que é um .xlsx exportado do ERP.";
  }
}

const CHUNK_SIZE = 140;
async function commitMonthImport(monthKey, incomingRows, onProgress){
  let {meta, leads} = await ensureMonthLoaded(monthKey);
  const byCod = {};
  leads.forEach(l=>{ byCod[l.cod] = l; });
  if(!meta){
    meta = {monthKey, importedAt: nowISO(), sourceFilename:"", totalLeads:0, chunkCount:0, codToChunk:{}};
  }
  const chunkCache = {}; // ci -> {leads:[]}
  async function getChunkCached(ci){
    if(chunkCache[ci]) return chunkCache[ci];
    const c = await Store.getChunk(monthKey, ci);
    c.leads = c.leads || [];
    chunkCache[ci] = c;
    return c;
  }
  let lastChunk = meta.chunkCount>0 ? await getChunkCached(meta.chunkCount-1) : null;
  let lastIdx = meta.chunkCount>0 ? meta.chunkCount-1 : -1;
  if(lastIdx<0 || (lastChunk && lastChunk.leads.length>=CHUNK_SIZE)){
    lastIdx = meta.chunkCount; lastChunk = {leads:[]}; chunkCache[lastIdx] = lastChunk; meta.chunkCount = lastIdx+1;
  }

  let n=0;
  for(const fresh of incomingRows){
    const existing = byCod[fresh.cod];
    const merged = applyImportToLead(existing, fresh, monthKey);
    if(existing){
      const ci = meta.codToChunk[fresh.cod];
      const chunk = await getChunkCached(ci);
      const idx = chunk.leads.findIndex(x=>x.cod===fresh.cod);
      if(idx>=0) chunk.leads[idx] = merged; else chunk.leads.push(merged);
    }else{
      if(lastChunk.leads.length>=CHUNK_SIZE){
        lastIdx = meta.chunkCount; lastChunk = {leads:[]}; chunkCache[lastIdx] = lastChunk; meta.chunkCount = lastIdx+1;
      }
      lastChunk.leads.push(merged);
      meta.codToChunk[fresh.cod] = lastIdx;
    }
    byCod[fresh.cod] = merged;
    n++;
    if(n%25===0) onProgress(25);
  }
  onProgress(n%25);

  for(const ci of Object.keys(chunkCache)){
    await Store.setChunk(monthKey, Number(ci), chunkCache[ci]);
  }
  meta.totalLeads = Object.keys(meta.codToChunk).length;
  meta.importedAt = nowISO();
  await Store.setMeta(monthKey, meta);
  state._monthCache[monthKey] = null;
}

// Shared xlsx download helper (used by the pipeline export and the
// Comparativo & histórico export): sheets = [{name, rows}], rows = array of
// plain objects (json_to_sheet-compatible).
async function downloadWorkbook(sheets, filename){
  const wb = XLSX.utils.book_new();
  sheets.forEach(({name, rows})=>{
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  });
  const out = XLSX.write(wb, {type:"array", bookType:"xlsx"});
  const blob = new Blob([out], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  if(downloadsNS){
    try{
      await downloadsNS.save({filename, data:blob});
      toast("Arquivo exportado.");
    }catch(err){
      if(err && err.code==="declined") return;
      toast("Não foi possível exportar agora.", "err");
    }
  }else{
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast("Arquivo exportado.");
    }catch(err){
      toast("Não foi possível exportar agora.", "err");
    }
  }
}

  const months = await Store.listMonths();

  if(!sorted.length){

          <tbody>
